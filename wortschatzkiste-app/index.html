<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#163a30">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Wortschatzkiste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#E3F0E9; --surface:#FFFFFF; --ink:#15302A; --muted:#4F6B62; --line:#C4DACF;
  --chalk:#FFC83D; --chalk-ink:#3A2A00;
  --good:#1F8F5C; --bad:#D8414A;
  --paper:#FFFFFF; --paper-ink:#1B2A26; --paper-line:#B7D2EC; --paper-red:#E2575C;
  --b1:#E5484D; --b2:#F08C2E; --b3:#EDBE22; --b4:#86BD45; --b5:#1F8F5C;
  --shadow: 0 2px 0 rgba(21,48,42,.18);
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#123229; --surface:#1B4236; --ink:#EAF4EF; --muted:#A3C3B7; --line:#2D5C4D;
    --shadow: 0 2px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#123229; --surface:#1B4236; --ink:#EAF4EF; --muted:#A3C3B7; --line:#2D5C4D;
  --shadow: 0 2px 0 rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  font-size:18px; line-height:1.4;
  -webkit-tap-highlight-color: transparent;
}
#app{max-width:560px; margin:0 auto; padding:16px 16px 40px}
h1{font-size:2rem; line-height:1.1; margin:.2em 0 .1em; font-weight:800; letter-spacing:-.01em}
h2{font-size:1.25rem; margin:1.4em 0 .5em; font-weight:700}
p{margin:.3em 0}
.muted{color:var(--muted)}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, .group-row:focus-visible{outline:3px solid var(--chalk); outline-offset:2px}

.btn{
  display:flex; align-items:center; justify-content:center; gap:.4em;
  width:100%; min-height:56px; padding:10px 18px; border:0; border-radius:16px;
  font-size:1.15rem; font-weight:700;
  background:var(--chalk); color:var(--chalk-ink); box-shadow:var(--shadow);
}
.btn:active{transform:translateY(2px); box-shadow:none}
.btn[disabled]{opacity:.45; transform:none}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:none; border:2px solid var(--line)}
.btn.good{background:var(--good); color:#fff}
.btn.bad{background:var(--bad); color:#fff}
.btn.small{min-height:44px; width:auto; font-size:1rem; padding:6px 14px; border-radius:12px}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px}
.back{background:none; border:0; padding:8px 4px; font-size:1.05rem; font-weight:600; color:var(--muted); min-height:44px}
.icon-btn{background:var(--surface); border:2px solid var(--line); border-radius:12px; min-width:44px; min-height:44px; font-size:1.1rem}

.hero{padding:10px 0 14px}
.hero .box-art{font-size:2.6rem; line-height:1}

.list{display:flex; flex-direction:column; gap:10px; margin:14px 0 18px}
.group-row{
  display:block; width:100%; text-align:left; border:0;
  background:var(--surface); border-radius:18px; padding:14px 16px 16px;
  box-shadow:var(--shadow); border-left:8px solid var(--chalk);
}
.group-row .name{font-size:1.25rem; font-weight:700; display:block}
.group-row .meta{color:var(--muted); font-size:.95rem}
.boxbar{height:10px; border-radius:6px; overflow:hidden; margin-top:8px; background:var(--line)}
.boxbar span{display:block; height:100%; background:var(--good)}

.empty{background:var(--surface); border:2px dashed var(--line); border-radius:18px; padding:20px; text-align:center; margin:16px 0}

.panel{background:var(--surface); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin:12px 0}
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:var(--bg); padding:5px; border-radius:14px; margin-bottom:14px}
.seg button{border:0; background:transparent; border-radius:10px; min-height:44px; font-weight:700; font-size:1rem; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}


label.field{display:block; margin-bottom:10px}
label.field span{display:block; font-weight:600; font-size:.95rem; color:var(--muted); margin-bottom:2px}
input[type=text]{
  width:100%; min-height:52px; padding:10px 14px; font:inherit; font-size:1.15rem;
  border:2px solid var(--line); border-radius:14px; background:var(--bg); color:var(--ink);
}
.msg{min-height:1.4em; font-size:.95rem; font-weight:600; margin:4px 0 8px}
.msg.ok{color:var(--good)} .msg.err{color:var(--bad)}

.words{list-style:none; margin:0; padding:0}
.words li button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:0; border-bottom:2px solid var(--line); padding:12px 2px; min-height:52px;
}
.words li:last-child button{border-bottom:0}
.words li button:disabled{color:inherit; cursor:default; opacity:1}

.hero-top{display:flex; justify-content:space-between; align-items:flex-start}
.hero-actions{display:flex; gap:8px}
.backup-btn{min-width:52px; min-height:52px; font-size:1.5rem; border-radius:14px}

/* Gruppen zusammen üben */
.group-row{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:pan-y; position:relative}
.swipe-wrap{position:relative; border-radius:18px}
body{overflow-x:hidden}
.swipe-bg{position:absolute; inset:0; border-radius:18px; background:var(--good); color:#fff; font-weight:800; font-size:1.05rem; display:flex; align-items:center; padding-left:20px; opacity:0}
.swipe-bg.ready{background:color-mix(in srgb, var(--good) 80%, #000)}
.mix-hint{margin:0; text-align:center; font-weight:700; color:var(--muted)}
.group-row.selected{outline:4px solid var(--chalk); outline-offset:-2px; background:color-mix(in srgb, var(--chalk) 16%, var(--surface))}
.group-row.disabled{opacity:.4}
.sel-mark{flex:none; width:30px; height:30px; border-radius:50%; border:3px solid var(--line); display:inline-flex; align-items:center; justify-content:center; font-weight:800; margin-right:8px; background:var(--surface)}
.group-row.selected .sel-mark{background:var(--chalk); border-color:var(--chalk); color:var(--chalk-ink)}
.row-head .name{flex:1; min-width:0}
.mix-bar{position:fixed; left:0; right:0; bottom:0; z-index:30; max-width:560px; margin:0 auto; background:var(--surface); border-radius:22px 22px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.18); padding:14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:10px}
.mix-bar .seg{margin:0}
.mix-bar .seg button{font-size:.95rem}
.mix-head{display:flex; justify-content:space-between; align-items:center; font-size:1.1rem}
.mix-from{margin-bottom:6px}
.tier .mix-lv{font-size:min(2rem, 8vw) !important; padding:4px 0}

.lost-award{display:flex; align-items:center; gap:12px; background:var(--surface); border:2px dashed color-mix(in srgb, var(--bad) 60%, var(--surface)); border-radius:16px; padding:12px 16px; font-weight:700; margin:10px 0}
.lost-award .icon{font-size:2.2rem; line-height:1}

.verdict-btn{display:block; width:100%; border:0; font:inherit; font-size:1.15rem; font-weight:700; cursor:pointer}
.verdict-next{display:inline-block; margin-left:8px; padding:2px 12px; border-radius:999px; background:rgba(255,255,255,.22)}
.tap-guard #task, .tap-guard #feedback{pointer-events:none}

.card-medal{flex:none; font-size:1.5rem; line-height:1; width:30px; text-align:center}

.info-video{border-radius:18px; overflow:hidden; background:#000; box-shadow:var(--shadow); margin:10px 0 6px}
.info-video video{display:block; width:100%; height:auto; max-height:60vh}
.info-steps{margin:0; padding-left:1.4em; display:flex; flex-direction:column; gap:10px; line-height:1.35}

/* Werkstatt */
.wallet{font-weight:800; font-size:1.2rem; background:var(--surface); border-radius:999px; padding:6px 14px; box-shadow:var(--shadow)}
.car-stage{position:relative; margin:12px 0 14px; border-radius:22px; overflow:hidden; cursor:pointer;
  background:linear-gradient(#BFE6F7 0%, #E6F5FB 62%, #9BCB8F 62%, #86B97A 100%); box-shadow:var(--shadow); touch-action:manipulation}
.car-svg{display:block; width:100%; height:auto; position:relative; z-index:1; overflow:visible; margin-top:16px}
.car-svg .car-wheel{transform-box:fill-box; transform-origin:center}
.car-svg .car-body{transform-box:fill-box; transform-origin:80% 100%}
.car-flames{opacity:0; transition:opacity .15s}
.car-flames.on{opacity:1; animation:flicker .12s infinite alternate}
@keyframes flicker{to{transform:scaleX(1.15) translateX(-3px)}}
.car-road{position:absolute; left:0; right:0; bottom:10px; height:18px; background:#5B6573; z-index:0}
.car-road::after{content:""; position:absolute; left:0; right:0; top:8px; height:2px; background:repeating-linear-gradient(90deg, #FFFFFF 0 22px, transparent 22px 44px)}
.car-hint{position:absolute; right:10px; top:8px; font-size:.85rem; font-weight:700; color:#15302A; background:rgba(255,255,255,.75); border-radius:999px; padding:2px 10px; z-index:2}
.garage-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px; scrollbar-width:none}
.garage-tabs button{flex:none; border:2px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font:inherit; font-weight:700; color:var(--ink); min-height:42px}
.garage-tabs button[aria-selected="true"]{background:var(--chalk); border-color:var(--chalk); color:var(--chalk-ink)}
.garage-items{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px}
.g-item{display:flex; flex-direction:column; align-items:center; gap:4px; border:3px solid transparent; background:var(--surface); border-radius:16px; padding:10px 6px; font:inherit; color:var(--ink); box-shadow:var(--shadow); min-height:104px}
.g-item.on{border-color:var(--good)}
.g-item:active{transform:translateY(2px)}
.swatch{width:34px; height:34px; border-radius:50%; border:2px solid rgba(0,0,0,.15)}
.g-icon{font-size:1.8rem; line-height:1}
.g-name{font-size:.85rem; font-weight:700; text-align:center; line-height:1.15}
.g-price{font-size:.8rem; font-weight:800; color:var(--muted)}
.g-item:not(.owned) .g-price{color:var(--chalk-ink); background:var(--chalk); border-radius:999px; padding:1px 8px}
.g-item.on .g-price{color:var(--good)}

.speak.off{opacity:.55; filter:grayscale(1)}

/* Konfetti */
canvas.confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50}

/* Wasser-Weg */
.pipes-wrap{background:#e8f2fb; border-radius:18px; padding:6px 4px 2px; box-shadow:var(--shadow)}
#pipes{display:block; width:100%; height:auto; max-height:62vh; margin:0 auto; user-select:none; -webkit-user-select:none}
#pipes path{fill:none; stroke-linecap:round; stroke-linejoin:round}
#pipes .p-gap{stroke:#e8f2fb; stroke-width:26}
#pipes .p-body{stroke:#8e9aa6; stroke-width:16}
#pipes .p-shine{stroke:#c4ccd4; stroke-width:4; transform:translateX(-3px)}
#pipes .water{stroke:#2f8ff0; stroke-width:9; stroke-dasharray:3000; stroke-dashoffset:3000}
#pipes .tap{cursor:pointer; outline:none}
#pipes .tap:focus-visible .tap-metal{stroke:#f2b400; stroke-width:3}
#pipes .tap-metal{fill:#9aa5b0}
#pipes .tap-red{fill:#e0444c}
#pipes .tap-cap{fill:#fff; opacity:.85}
#pipes .handle{transition:transform .5s}
#pipes .tap.open .handle{transform:rotate(90deg)}
#pipes .tap-num{font:800 12px "Baloo 2",system-ui,sans-serif; fill:#5b6b75; text-anchor:middle; opacity:0}
#pipes.busy .tap:not(.open){opacity:.55}
#pipes .b-box{fill:#fff; stroke:#8e9aa6; stroke-width:3}
#pipes .b-fill{fill:#7cc0ff; transform:scaleY(0); transform-box:fill-box; transform-origin:bottom; transition:transform .5s}
#pipes .basin.full .b-fill{transform:scaleY(.55)}
#pipes .b-word{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif; font-weight:800; fill:#1b2a26; text-anchor:middle; dominant-baseline:middle}
#pipes .b-flower{font-size:30px; text-anchor:middle; opacity:0; transform-box:fill-box; transform-origin:bottom; transform:scale(.2); transition:opacity .3s, transform .5s cubic-bezier(.3,1.6,.5,1)}
#pipes .basin.win .b-flower{opacity:1; transform:scale(1)}
#pipes .basin.win .b-box{stroke:#1f8f5c; stroke-width:5}
#pipes .b-mark{font:800 22px "Baloo 2",system-ui,sans-serif; fill:#d8414a; text-anchor:middle; opacity:0}
#pipes .basin.lose .b-mark{opacity:1}
#pipes .basin.lose .b-box{stroke:#d8414a; stroke-width:5}
@media (prefers-reduced-motion: reduce){ #pipes .handle, #pipes .b-fill, #pipes .b-flower{transition:none} }

/* Wort-Gipfel */
.mini-card.compact{min-height:0; padding:6px 14px 8px; margin-bottom:10px; background:var(--paper); border-top:4px solid var(--paper-red)}
.mini-card.compact .lang{height:26px; font-size:.85rem}
.mini-card.compact .word{padding-top:4px; font-size:clamp(1.4rem, 7vw, 2rem)}
.climb-wrap{border-radius:18px; overflow:hidden; box-shadow:var(--shadow); touch-action:none}
#climb{display:block; width:100%; height:min(56vh, 430px); touch-action:none}
.pad-ctrl{display:grid; grid-template-columns:1fr 1fr 1.5fr; gap:10px; margin-top:10px; user-select:none; -webkit-user-select:none}
.ctl{min-height:64px; border:0; border-radius:18px; background:var(--surface); color:var(--ink); font-size:1.8rem; font-weight:800; box-shadow:var(--shadow); touch-action:none; -webkit-touch-callout:none}
.ctl.jump{background:var(--chalk); color:var(--chalk-ink); font-size:1.2rem}
.ctl.down{transform:translateY(2px); box-shadow:none; filter:brightness(.93)}

/* Bearbeiten */
.group-tools{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 4px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.lang-chip{font-size:1.3rem; padding:4px 14px}
.group-tools .btn{font-size:.9rem; padding:6px 8px}
.grade-chip{margin-top:10px; border:2px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 16px; font:inherit; font-size:1.05rem; font-weight:800; color:var(--ink); min-height:44px; box-shadow:var(--shadow)}
.grade-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin:22px 0}
.grade-btn{aspect-ratio:1; border:0; border-radius:22px; background:var(--surface); box-shadow:var(--shadow); font:inherit; color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
.grade-btn b{font-size:2.6rem; line-height:1; font-weight:800}
.grade-btn span{font-size:.95rem; color:var(--muted); font-weight:600}
.grade-btn[aria-pressed="true"]{background:var(--chalk)}
.grade-btn[aria-pressed="true"] span{color:var(--chalk-ink)}
.grade-btn:active{transform:translateY(2px); box-shadow:none}
.group-tools .btn{width:100%; background:var(--surface)}
.cards-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px}
.cards-head h2{margin:0; display:flex; align-items:center; gap:8px}
.cards-head .count{font-size:.95rem; background:var(--bg); border-radius:999px; padding:0 10px; color:var(--muted)}
.cards-actions{display:flex; gap:6px}
.icon-btn.act{min-width:48px; min-height:48px; font-size:1.35rem; border-radius:14px}
.icon-btn.act[aria-pressed="true"]{border-color:var(--chalk); background:color-mix(in srgb, var(--chalk) 25%, var(--surface))}
.add-form{display:flex; flex-direction:column; gap:8px; background:var(--bg); border-radius:14px; padding:10px; margin:8px 0 2px}
.add-form input{background:var(--surface)}
.edit-ico{font-size:1.05rem; opacity:.8}
.photo-busy{display:flex; align-items:center; gap:12px; background:var(--bg); border-radius:14px; padding:12px; margin:8px 0}
.photo-busy > span:nth-child(2){flex:1; line-height:1.3}
.spin{font-size:1.8rem; animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}

/* Stapel antippen */
.stack.tappable{cursor:pointer; -webkit-tap-highlight-color:transparent}
.stack.tappable:active .top-card{transform:translateY(4px) scale(.985)}
.stack.tappable:focus-visible{outline:3px solid var(--chalk); outline-offset:6px; border-radius:12px}
.tap-hint{text-align:center; margin-bottom:4px}
.tap-hint span{display:inline-block; background:var(--chalk); color:var(--chalk-ink); font-weight:800; font-size:1.05rem; padding:6px 16px; border-radius:999px; box-shadow:0 2px 0 rgba(0,0,0,.15); animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,70%,100%{transform:scale(1)} 80%{transform:scale(1.07)} 90%{transform:scale(.98)}}
@media (prefers-reduced-motion: reduce){ .tap-hint span{animation:none} }

/* Stufen */
.seg.levels{grid-template-columns:repeat(3,1fr); margin-bottom:6px}
.seg.levels button{display:flex; flex-direction:column; align-items:center; gap:0; min-height:58px; line-height:1.1}
.lv-icon{font-size:1.4rem}
.level-desc{font-size:.9rem; color:var(--muted); margin:2px 2px 4px}
.level-desc strong{color:var(--ink)}
.medal-tiers{display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:5px; align-items:end; margin:8px 0 6px}
.tier{background:var(--surface); border:3px solid transparent; border-radius:14px; padding:5px 2px 4px; text-align:center; box-shadow:var(--shadow); font:inherit; color:inherit; min-width:0; overflow:hidden; cursor:pointer}
.tier[aria-pressed="true"]{border-color:var(--chalk); background:color-mix(in srgb, var(--chalk) 22%, var(--surface))}
.tier[aria-pressed="false"] .tier-name{opacity:.75}
.tier:active{transform:translateY(2px)}
.tier-medals{display:flex; justify-content:center; line-height:1.1; white-space:nowrap}
.tier.t0 .tier-medals{font-size:min(1rem, 4vw)}
.tier.t1 .tier-medals{font-size:min(1.2rem, 4.6vw)}
.tier.t2 .tier-medals{font-size:min(1.4rem, 5.2vw)}
.tier.t3 .tier-medals{font-size:min(1.65rem, 5.8vw)}
.tier .tier-name{font-size:.7rem; white-space:normal; line-height:1.15; overflow:visible}
.tier .tier-name .tn-icon{display:block; font-size:.95rem}
.tier-name{font-size:.8rem; font-weight:800; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row-awards .mini.t0{font-size:.8em} .row-awards .mini.t1{font-size:.95em} .row-awards .mini.t2{font-size:1.1em} .row-awards .mini.t3{font-size:1.3em}
.new-award.big-letters .icon{font-size:2.5rem}
.new-award.big-tipp .icon{font-size:2.8rem}
.tile.wrong{background:var(--bad); color:#fff; animation:shake .35s}
.new-award.big-profi .icon{font-size:3.4rem}

/* Profi-Modus */
.toggle{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--bg); border:2px solid var(--line); border-radius:16px; padding:10px 12px; margin:0 0 14px; min-height:64px}
.toggle[aria-checked="true"]{border-color:var(--chalk); background:color-mix(in srgb, var(--chalk) 18%, var(--surface))}
.tg-icon{font-size:1.8rem; line-height:1}
.tg-text{flex:1; display:flex; flex-direction:column; line-height:1.25}
.tg-text strong{font-size:1.1rem}
.tg-text span{font-size:.85rem; color:var(--muted)}
.switch{width:52px; height:30px; border-radius:15px; background:var(--line); position:relative; flex:none; transition:background .2s}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .2s}
.toggle[aria-checked="true"] .switch{background:var(--good)}
.toggle[aria-checked="true"] .switch::after{transform:translateX(22px)}
.task-type{font-weight:700; color:var(--muted); margin:-6px 0 10px; font-size:1rem}
.mini-card{position:relative; padding:10px 16px 14px; margin-bottom:14px; min-height:150px; display:flex; flex-direction:column}
.mini-card .lang{font-size:.95rem; font-weight:700; color:#6A7A75; height:36px; display:flex; align-items:center; gap:6px}
.mini-card .word{flex:1; display:flex; align-items:center; justify-content:center; text-align:center; font-size:clamp(1.6rem, 8vw, 2.4rem); font-weight:800; line-height:1.15; overflow-wrap:anywhere; padding-top:10px}
input.typed{font-size:1.4rem; min-height:60px; text-align:center; font-weight:700}
input.typed.ok{border-color:var(--good); background:color-mix(in srgb, var(--good) 15%, var(--surface))}
input.typed.no{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--surface)); text-decoration:line-through}
.verdict{border-radius:14px; padding:12px 16px; margin:12px 0; font-size:1.15rem; font-weight:700; text-align:center}
.verdict.good{background:var(--good); color:#fff}
.verdict.bad{background:color-mix(in srgb, var(--bad) 14%, var(--surface)); border:2px solid var(--bad)}
.choices{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.choice{min-height:70px; border:2px solid var(--line); background:var(--surface); border-radius:16px; font-size:1.1rem; font-weight:700; padding:8px; box-shadow:var(--shadow); overflow-wrap:anywhere}
.choice:active{transform:translateY(2px); box-shadow:none}
.choice.right{background:var(--good); border-color:var(--good); color:#fff}
.choice.wrong{background:var(--bad); border-color:var(--bad); color:#fff; animation:shake .35s}
.choice:disabled{opacity:1}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin:6px 0 16px; min-height:52px}
.slot{width:36px; height:46px; border-bottom:4px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:800}
.slot.filled{border-color:var(--chalk)}
.gap{width:14px}
.slots.ok .slot{border-color:var(--good); color:var(--good)}
.slots.no{animation:shake .35s}
.slots.no .slot{border-color:var(--bad); color:var(--bad)}
.tiles{display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
.tile{width:48px; height:52px; border:0; border-radius:12px; background:var(--chalk); color:var(--chalk-ink); font-size:1.5rem; font-weight:800; box-shadow:var(--shadow)}
.tile:disabled{opacity:.2; box-shadow:none}
.pond{position:relative; height:300px; border-radius:22px; overflow:hidden;
  background:radial-gradient(ellipse at 30% 20%, #7fd3e6 0%, #3aa7c9 45%, #1f7fa6 100%); box-shadow:inset 0 0 0 4px rgba(255,255,255,.25)}
.ripple{position:absolute; border:2px solid rgba(255,255,255,.35); border-radius:50%; animation:ripple 4s infinite ease-out}
.r1{width:60px; height:24px; left:12%; top:58%} .r2{width:80px; height:30px; right:10%; top:70%; animation-delay:2s}
@keyframes ripple{from{transform:scale(.4); opacity:1} to{transform:scale(1.6); opacity:0}}
.pad{position:absolute; width:31%; aspect-ratio:1.25; border:0; padding:6px; border-radius:50% 50% 50% 50% / 55% 55% 45% 45%;
  background:radial-gradient(circle at 40% 35%, #8fdc6a, #4fae3b 70%, #3a8f2c); color:#14321a; font-weight:800; font-size:.95rem; line-height:1.1;
  box-shadow:0 5px 0 rgba(0,0,0,.18); display:flex; align-items:center; justify-content:center; text-align:center; overflow-wrap:anywhere; transition:transform .4s, opacity .4s}
.pad span{background:rgba(255,255,255,.82); border-radius:10px; padding:3px 6px; max-width:100%}
.pad.p0{left:2%; top:9%} .pad.p1{left:34.5%; top:2%} .pad.p2{right:2%; top:11%}
.pad.right{box-shadow:0 0 0 5px #fff, 0 0 22px 6px #ffe680}
.pad.sink{transform:scale(.55) translateY(20px); opacity:.25}
.pad:disabled{cursor:default}
.start-pad{position:absolute; left:50%; bottom:14px; width:90px; height:52px; transform:translateX(-50%); border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #8fdc6a, #4fae3b 70%, #3a8f2c); box-shadow:0 4px 0 rgba(0,0,0,.18)}
.frog{position:absolute; left:50%; bottom:28px; width:60px; margin-left:-30px; text-align:center; font-size:3rem; line-height:1; z-index:3; transition:opacity .3s}
.frog.hop{animation:hop .6s cubic-bezier(.35,.1,.4,1) forwards}
@keyframes hop{
  0%{transform:translate(0,0) scale(1)}
  15%{transform:translate(0,6px) scale(1.1,.85)}
  55%{transform:translate(calc(var(--dx) * .55), calc(var(--dy) * .55 - 60px)) scale(1.35)}
  100%{transform:translate(var(--dx), var(--dy)) scale(1)}}
.frog.splash{opacity:0}
.frog.happy{filter:drop-shadow(0 0 8px #fff7b0)}
.splashfx{position:absolute; font-size:2.6rem; transform:translate(-50%,-50%); animation:splashfx .6s ease-out}
@keyframes splashfx{from{transform:translate(-50%,-50%) scale(.3)} to{transform:translate(-50%,-50%) scale(1)}}
.bonus{font-weight:800; color:var(--ink); background:color-mix(in srgb, var(--chalk) 35%, var(--surface)); display:inline-block; padding:4px 12px; border-radius:12px; margin-top:6px}
@media (prefers-reduced-motion: reduce){ .ripple{animation:none; opacity:0} .frog.hop{animation-duration:.01s} }

/* Liste einfügen */
textarea{width:100%; min-height:180px; padding:10px 14px; font:inherit; font-size:1.05rem; line-height:1.35;
  border:2px solid var(--line); border-radius:14px; background:var(--bg); color:var(--ink); resize:vertical}
textarea.half{min-height:150px}
.steps{margin:6px 0 14px; padding-left:1.3em; color:var(--muted)}
.steps li{margin:3px 0}
.phead, .prow{display:grid; grid-template-columns:1.6em 1fr 1fr 44px; gap:6px; align-items:center}
.phead{font-weight:700; font-size:.9rem; color:var(--muted); margin-bottom:4px}
.prow{margin-bottom:6px}
.prow .pn{font-size:.85rem; color:var(--muted); text-align:right}
.prow input{min-height:46px; font-size:1rem; padding:8px 10px; border-radius:10px; min-width:0}
.prow input.missing{border-color:var(--bad)}
.prow.dupe input{opacity:.5}
.pmore{min-height:46px; border:2px solid var(--line); background:var(--surface); border-radius:10px; font-size:1.2rem; font-weight:800}
.note{border-radius:12px; padding:10px 14px; margin:10px 0; font-weight:600; font-size:.95rem}
.note.warn{background:color-mix(in srgb, var(--bad) 14%, var(--surface)); color:var(--ink); border:2px solid var(--bad)}
.note.info{background:var(--bg); color:var(--ink)}
.pbar{display:flex; gap:8px; margin:6px 0 12px}
.pbar .btn{flex:1}

/* Belohnungen */
.awards{display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin:6px 0 4px; font-size:1.7rem; line-height:1.2}
.awards .stars{font-size:1.2rem; font-weight:800; background:var(--surface); border-radius:12px; padding:4px 12px; box-shadow:var(--shadow)}
.awards .medals, .awards .trophies{display:flex; gap:4px; align-items:center}
.awards small{font-size:1rem; font-weight:800; margin-left:2px}
.award-off{filter:grayscale(1); opacity:.28}
.goal{font-size:.95rem; color:var(--muted); margin:2px 0}
.row-head{display:flex; justify-content:space-between; align-items:center; gap:8px}
.row-awards{font-size:1.35rem; font-weight:700; white-space:nowrap; display:flex; gap:2px}
.stars-won{font-size:3.2rem; line-height:1; margin-bottom:6px}
.stars-won span{display:inline-block; animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards}
.stars-won span:nth-child(2){animation-delay:.15s}
.stars-won span:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
.new-award{display:flex; align-items:center; gap:12px; background:var(--chalk); color:var(--chalk-ink); border-radius:16px; padding:12px 16px; font-weight:700; font-size:1.1rem; margin:10px 0; box-shadow:var(--shadow)}
.new-award .icon{font-size:2.2rem; line-height:1}
@media (prefers-reduced-motion: reduce){ .stars-won span{animation:none} }
.words .en{font-weight:700}
.words .de{color:var(--muted)}
.words .pair{flex:1; min-width:0; overflow-wrap:anywhere}
.dot{width:14px; height:14px; border-radius:50%; flex:none}

/* Stapel */
.stack{position:relative; width:100%; aspect-ratio:5 / 3.4; min-height:220px; margin:8px 0 34px}
.paper{
  border-radius:10px; color:var(--paper-ink);
  background:
    linear-gradient(var(--paper-red),var(--paper-red)) 0 46px / 100% 2px no-repeat,
    repeating-linear-gradient(to bottom, transparent 0 33px, var(--paper-line) 33px 35px) 0 46px / 100% 100% no-repeat,
    var(--paper);
  box-shadow: 0 4px 0 rgba(0,0,0,.14), 0 10px 20px rgba(0,0,0,.10);
}
.under{position:absolute; inset:0}
.under.u1{transform:translateY(12px) scale(.955); filter:brightness(.96)}
.under.u2{transform:translateY(24px) scale(.91); filter:brightness(.91)}
.top-card{position:absolute; inset:0; perspective:1200px}
.top-card.away-near{animation:near .38s ease-in forwards}
.top-card.away-far{animation:far .42s ease-in forwards}
@keyframes near{to{transform:translateY(14px) scale(.95); opacity:0}}
@keyframes far{to{transform:translateY(40px) scale(.86) rotate(-4deg); opacity:0}}
.top-card.enter{animation:enter .25s ease-out}
@keyframes enter{from{transform:translateY(12px) scale(.955)}}
.card{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; padding:10px 16px 16px}
.face.back{transform:rotateY(180deg)}
.face .lang{font-size:.95rem; font-weight:700; color:#6A7A75; height:36px; display:flex; align-items:center; gap:6px}
.face .word{flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:clamp(1.8rem, 9vw, 2.8rem); font-weight:800; line-height:1.15; overflow-wrap:anywhere; padding:0 4px}
.face .hint{font-size:.9rem; color:#6A7A75; text-align:center}
.stack-info .word{font-size:clamp(1.6rem, 8vw, 2.4rem)}
.speak{position:absolute; top:6px; right:8px; border:0; background:#EEF4FA; border-radius:10px; min-width:44px; min-height:40px; font-size:1.2rem; z-index:2}
.progress{height:12px; background:var(--surface); border-radius:8px; overflow:hidden; margin:6px 0 18px}
.progress span{display:block; height:100%; background:var(--chalk); transition:width .3s}
.answers{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.sorted{min-height:56px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.1rem; color:var(--muted)}
.sure{display:flex; align-items:center; gap:10px; margin:0 0 14px; font-weight:600}
.sure .bar{flex:1; height:12px; background:var(--bg); border-radius:8px; overflow:hidden}
.sure .bar span{display:block; height:100%; background:var(--good)}
.result{text-align:center; padding:20px 0}
.result .big{font-size:3.4rem; line-height:1}
.missed{text-align:left}

/* Dialog */
dialog{border:0; border-radius:20px; padding:20px; width:min(92vw, 440px); background:var(--surface); color:var(--ink)}
dialog::backdrop{background:rgba(10,30,24,.55)}
dialog h3{margin:0 0 12px; font-size:1.3rem}
.dlg-actions{display:flex; flex-direction:column; gap:8px; margin-top:12px}

.banner{background:var(--bad); color:#fff; border-radius:12px; padding:10px 14px; margin-bottom:12px; font-size:.95rem}

@media (prefers-reduced-motion: reduce){ .card,.progress span{transition:none} .top-card{animation-duration:.01s !important} }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>

<script>
(function(){
"use strict";
const KEY = "wortschatzkiste-v1";
const ROUND_SIZE = 10;
const app = document.getElementById("app");
const dlg = document.getElementById("dlg");

let storageOk = true;
let S = load();
let ui = { groupId: null, dir: "ende", session: null, result: null, flash: null, busy: false, editMode: false, select: null };
let suppressClickUntil = 0;

function load(){
  let d = null;
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) d = JSON.parse(raw);
  }catch(e){ storageOk = false; }
  if(!d || !Array.isArray(d.groups) || !Array.isArray(d.words)) d = { groups: [], words: [] };
  return migrate(d);
}
function migrate(d){
  // Umstellung von Version 1 (Fächer) auf Stapel
  d.words.forEach(w => {
    if(!w.level){
      const b = w.box || { ende:1, deen:1 };
      w.level = { ende: Math.max(0, b.ende - 1), deen: Math.max(0, b.deen - 1) };
      delete w.box;
    }
    // „Im Kopf“ bekommt eine eigene Serie; bisheriger Stand wird übernommen
    if(!w.ml) w.ml = {};
    if(w.ml.normal === undefined) w.ml.normal = Math.max(w.level.ende, w.level.deen);
  });
  if(!d.settings) d.settings = {};
  if(!d.settings.mode) d.settings.mode = d.settings.advanced ? "profi" : "normal";
  if(!d.settings.lang) d.settings.lang = "en";
  if(!d.garage) d.garage = { owned:{}, equip:{}, spent:0 };
  d.groups.forEach(g => { if(!g.lang) g.lang = "en"; });
  delete d.settings.advanced;
  d.groups.forEach(g => {
    if(!Array.isArray(g.order)) g.order = [];
    if(typeof g.stars !== "number") g.stars = 0;
    if(!g.medals) g.medals = {};
    if(g.medals.bronze !== undefined || g.medals.silver !== undefined || g.medals.gold !== undefined){
      const old = g.medals; g.medals = { normal: { bronze: !!old.bronze, silver: !!old.silver, gold: !!old.gold } };
    }
  });
  return d;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
  catch(e){ storageOk = false; }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return s.trim().replace(/\s+/g," "); }

/* Sprachen: das Feld „en“ einer Karte enthält immer das Wort in der Fremdsprache der Gruppe */
const LANGS = {
  en: { key:"en", flag:"🇬🇧", name:"Englisch", adj:"englische", code:"EN", speech:"en-GB", ocr:"eng" },
  fr: { key:"fr", flag:"🇫🇷", name:"Französisch", adj:"französische", code:"FR", speech:"fr-FR", ocr:"fra" }
};
function langOf(key){ return LANGS[key] || LANGS.en; }
function groupLang(g){ return langOf(g && g.lang); }
function wordLang(w){ return groupLang(group(w.groupId)); }
function dirLabels(L){ return [["ende", L.code + " → DE"], ["deen", "DE → " + L.code], ["mix", "Gemischt"]]; }
function group(id){ return S.groups.find(g => g.id === id); }
function wordsOf(id){ return S.words.filter(w => w.groupId === id); }
function wordById(id){ return S.words.find(w => w.id === id); }
function levelOf(w, dir){ return dir === "mix" ? Math.min(w.level.ende, w.level.deen) : w.level[dir]; }
function dotColor(l){ return l <= 1 ? "var(--b1)" : l <= 3 ? "var(--b3)" : "var(--b5)"; }
function bestLevel(w){ return Math.max(w.level.ende, w.level.deen); }
function isSure(w){ return bestLevel(w) >= 3; }

/* ---------- Belohnungen pro Gruppe ----------
   Drei Stufen: Im Kopf (normal), Tippen, Profi. Jede Stufe hat eigene Medaillen,
   je höher die Stufe, desto größer die Medaille und desto mehr Bonus-Sterne. */
const MODES = [
  { key:"normal", icon:"🧠", name:"Im Kopf", short:"Im Kopf", bonus:0, desc:"Karte umdrehen und selbst sagen, ob du es wusstest." },
  { key:"letters", icon:"🔤", name:"Buchstaben", short:"Buchstaben", bonus:1, desc:"Die Buchstaben der Lösung in der richtigen Reihenfolge antippen. +1 Bonus-Stern." },
  { key:"tipp",   icon:"⌨️", name:"Tippen",  short:"Tippen",  bonus:2, desc:"Jede Übersetzung selbst eintippen. Groß- und Kleinschreibung zählt nicht. +2 Bonus-Sterne." },
  { key:"profi",  icon:"🚀", name:"Profi",   short:"Profi",   bonus:3, desc:"Eintippen, Buchstaben, Antippen, Frosch-Sprung, Wort-Gipfel und Wasser-Weg, bunt gemischt. +3 Bonus-Sterne." }
];
function modeOf(k){ return MODES.find(m => m.key === k) || MODES[0]; }
// Medaillen nach dem Durchschnitt des Lernstands (0 bis 5) aller Karten der Gruppe
function avgLevel(ws, L){ return ws.length ? ws.reduce((a, w) => a + L(w), 0) / ws.length : 0; }
const MEDALS = [
  { key:"bronze", icon:"🥉", name:"Bronze", need:2, test: (ws, L) => avgLevel(ws, L) >= 2 },
  { key:"silver", icon:"🥈", name:"Silber", need:4, test: (ws, L) => avgLevel(ws, L) >= 4 },
  { key:"gold", icon:"🥇", name:"Gold", need:5, test: (ws, L) => avgLevel(ws, L) >= 5 }
];
const MIN_CARDS_FOR_MEDAL = 1;
// Pokale bei 10, 25 und 50 Sternen, danach alle 50 Sterne ein weiterer (100, 150, 200 …)
function trophies(g){
  const s = g.stars || 0;
  return (s >= 10 ? 1 : 0) + (s >= 25 ? 1 : 0) + (s >= 50 ? 1 + Math.floor((s - 50) / 50) : 0);
}
function nextTrophy(g){
  const s = g.stars || 0;
  return s < 10 ? 10 : s < 25 ? 25 : 50 * (Math.floor(s / 50) + 1);
}
function starsForRound(ratio){ return ratio >= .9 ? 3 : ratio >= .6 ? 2 : 1; }
// Lernstand pro Stufe: „Im Kopf“ nutzt den normalen Stand, Tippen und Profi zählen eigene Serien
// Jede Stufe zählt ihre eigene Serie (0 bis 5); der allgemeine Lernstand bestimmt nur die Reihenfolge im Stapel
function modeLevel(w, mode){ return (w.ml && w.ml[mode]) || 0; }
// Medaillen gelten nur, solange der Durchschnitt reicht: sinkt er, ist die Medaille wieder weg
function hasMedal(g, modeKey, m){
  const ws = wordsOf(g.id);
  return ws.length >= MIN_CARDS_FOR_MEDAL && m.test(ws, w => modeLevel(w, modeKey));
}
function checkMedals(g){
  if(!g.medals) g.medals = {};
  const changes = [];
  MODES.forEach(md => {
    const before = g.medals[md.key] || {}, now = {};
    MEDALS.forEach(m => {
      now[m.key] = hasMedal(g, md.key, m);
      if(now[m.key] && !before[m.key]) changes.push({ medal:m, mode:md, won:true });
      if(!now[m.key] && before[m.key]) changes.push({ medal:m, mode:md, won:false });
    });
    g.medals[md.key] = now;
  });
  return changes;
}
function medalIcons(g, showMissing){
  if(!g.medals) g.medals = {};
  if(typeof g.stars !== "number") g.stars = 0;
  if(showMissing){
    return `<div class="medal-tiers" role="group" aria-label="Stufe wählen">${MODES.map((md, i) => `
      <button class="tier t${i}" data-mode="${md.key}" aria-pressed="${S.settings.mode === md.key}">
        <div class="tier-medals">${MEDALS.map(m => hasMedal(g, md.key, m)
          ? `<span title="${md.name}: ${m.name}">${m.icon}</span>`
          : `<span class="award-off" title="${md.name}: ${m.name} noch nicht geschafft">${m.icon}</span>`).join("")}</div>
        <div class="tier-name"><span class="tn-icon">${md.icon}</span>${md.short}</div>
      </button>`).join("")}</div>`;
  }
  return MODES.map((md, i) => MEDALS.filter(m => hasMedal(g, md.key, m))
    .map(m => `<span class="mini t${i}" title="${md.name}: ${m.name}">${m.icon}</span>`).join("")).join("");
}
function awardsHeader(g){
  const t = trophies(g), next = nextTrophy(g), md = modeOf(S.settings.mode);
  const nextMedal = MEDALS.find(m => !hasMedal(g, md.key, m));
  const n = wordsOf(g.id).length;
  let goal = "";
  const avg = avgLevel(wordsOf(g.id), w => modeLevel(w, md.key));
  const fmt = x => (Math.round(x * 10) / 10).toLocaleString("de-DE");
  if(nextMedal) goal = !n
    ? "Füge Karten hinzu, um Medaillen zu sammeln."
    : `${md.icon} Stand: Ø ${fmt(avg)} von 5, noch ${fmt(Math.max(0.1, nextMedal.need - avg))} bis ${nextMedal.icon} ${nextMedal.name} (Ø ${nextMedal.need})`;
  else goal = `${md.icon} Alle ${md.name}-Medaillen geschafft! Halte den Ø auf 5, sonst geht Gold verloren.`;
  return `<div class="awards">
      <span class="stars">⭐ ${g.stars}</span>
      <span class="trophies">${t ? "🏆".repeat(Math.min(t, 3)) + (t > 3 ? `<small>×${t}</small>` : "") : '<span class="award-off">🏆</span>'}</span>
    </div>
    ${medalIcons(g, true)}
    <p class="level-desc"><strong>${md.icon} ${md.name}:</strong> ${md.desc}</p>`;
}

// Stapel-Reihenfolge der Gruppe aktuell halten
function stackOf(g){
  const ids = new Set(wordsOf(g.id).map(w => w.id));
  g.order = g.order.filter(id => ids.has(id));
  ids.forEach(id => { if(!g.order.includes(id)) g.order.push(id); });
  return g.order;
}
function plural(n, one, many){ return n + " " + (n === 1 ? one : many); }

/* ---------- Navigation ---------- */
function go(hash, replace){
  if(location.hash === hash){ render(); return; }
  if(replace) location.replace(hash); else location.hash = hash;
}
window.addEventListener("hashchange", render);

function render(){
  const h = location.hash;
  if(h === "#klasse") return renderGradePick(false);
  if(!S.settings.grade && h !== "#sicherung") return renderGradePick(true);
  if(h === "#gruppe" && group(ui.groupId)) return renderGroup();
  if(h === "#lernen" && ui.session) return renderLearn(true);
  if(h === "#ergebnis" && ui.result) return renderResult();
  if(h === "#import" && ui.imp && group(ui.groupId)) return renderImport();
  if(h === "#sicherung") return renderBackup();
  if(h === "#info") return renderInfo();
  if(h === "#werkstatt") return renderGarage();
  if(h === "#mix" && ui.mixIds) return renderMixPage();

}

function renderHome(){

      </div>

      <div class="chips">
        <button class="grade-chip" id="gradeBtn" aria-label="Klasse wechseln">🎒 ${grade}. Klasse <span aria-hidden="true">▾</span></button>
        <button class="grade-chip lang-chip" id="langBtn" aria-label="Sprache: ${L.name}. Tippen zum Wechseln" title="${L.name}">${L.flag} <span aria-hidden="true">▾</span></button>
      </div>
    </header>
    ${groups.length ? `<div class="list">${groups.map(g => {
      const ws = wordsOf(g.id), sure = ws.filter(w => isSure(w)).length, t = trophies(g);
      const on = sel && sel.has(g.id);
      return `<div class="swipe-wrap"><div class="swipe-bg" aria-hidden="true">${sel && sel.size >= 2 ? "🔀 Mix ▶" : "Öffnen ▶"}</div><button class="group-row ${on ? "selected" : ""} ${sel && !ws.length ? "disabled" : ""}" data-open="${esc(g.id)}" data-count="${ws.length}" ${sel ? `aria-pressed="${!!on}"` : ""}>
        <span class="row-head">${sel ? `<span class="sel-mark" aria-hidden="true">${on ? "✓" : ""}</span>` : ""}<span class="name">${esc(g.name)}</span>
          <span class="row-awards">${MEDALS.map(m => ws.length && m.test(ws, bestLevel) ? `<span title="${m.name}">${m.icon}</span>` : `<span class="award-off" title="${m.name} noch nicht erreicht">${m.icon}</span>`).join("")}</span></span>
        <span class="meta">${plural(ws.length, "Karte", "Karten")}${ws.length ? `, ${sure} ${sure === 1 ? "sitzt" : "sitzen"}` : ""}</span>
        <div class="boxbar" aria-hidden="true"><span style="width:${ws.length ? sure/ws.length*100 : 0}%"></span></div>

    : `<div class="empty"><p><strong>Noch keine ${L.name}-Gruppe in der ${grade}. Klasse.</strong></p><p class="muted">Tippe oben rechts auf ➕ und leg die erste an, zum Beispiel ${lang === "fr" ? "„Unité 1 – Les couleurs“" : "„Unit 1 – Colours“"}.</p></div>`}
    ${groups.length && !sel ? `<p class="goal" style="text-align:center">Tipp: Antippen oder nach rechts wischen öffnet eine Gruppe.${groups.length > 1 ? " Lange drücken wählt mehrere aus." : ""}</p>` : ""}
    ${sel ? `<div style="height:150px"></div>
    <div class="mix-bar" role="region" aria-label="Gruppen zusammen üben">
      <div class="mix-head"><strong>🔀 ${plural(sel.size, "Gruppe", "Gruppen")}, ${plural(selCards, "Karte", "Karten")}</strong>
        <button class="icon-btn" id="mixCancel" aria-label="Auswahl beenden">✕</button></div>
      <p class="mix-hint">${sel.size < 2 ? "Tippe weitere Gruppen an." : "Wische eine Gruppe nach rechts, um zusammen zu üben ▶"}</p>
    </div>` : ""}

  `;
  const rerender = () => { const y = window.scrollY; renderHome(); window.scrollTo(0, y); };
  // Wischen nach rechts öffnet (bei mehreren markierten Gruppen: zusammen üben), lange drücken markiert
  const swipeGo = id => {
    if(ui.select && ui.select.size >= 2){ ui.mixIds = [...ui.select]; ui.select = null; go("#mix"); return; }
    ui.select = null; ui.groupId = id; ui.editMode = false; go("#gruppe");
  };
  const allRows = [...app.querySelectorAll("[data-open]")];
  allRows.forEach(b => {
    const id = b.dataset.open, count = +b.dataset.count;
    const bg = b.parentElement.querySelector(".swipe-bg");
    // Bei mehreren markierten Gruppen bewegen sich alle markierten mit
    const movers = () => (ui.select && ui.select.size >= 2) ? allRows.filter(r => r === b || ui.select.has(r.dataset.open)) : [b];
    const bgOf = r => r.parentElement.querySelector(".swipe-bg");
    let timer = null, sx = 0, sy = 0, fired = false, swiping = false, dx = 0, down = false, swallow = false;
    const cancel = () => { clearTimeout(timer); timer = null; };
    const reset = () => {
      movers().forEach(r => {
        const rb = bgOf(r);
        r.style.transition = "transform .2s ease-out"; r.style.transform = ""; rb.style.opacity = 0; rb.classList.remove("ready");
        setTimeout(() => { r.style.transition = ""; }, 220);
      });
    };
    const finish = () => {
      down = false; cancel();
      if(fired){
        fired = false; swallow = true; setTimeout(() => { swallow = false; }, 80);
        setTimeout(() => { ui.select = new Set([id]); rerender(); }, 0);
        return;
      }
      if(swiping){
        swiping = false; swallow = true; setTimeout(() => { swallow = false; }, 80);
        if(dx >= 90){ movers().forEach(r => { r.style.transition = "transform .12s ease-in"; r.style.transform = "translateX(100%)"; }); setTimeout(() => swipeGo(id), 130); }
        else reset();
      }
    };
    b.addEventListener("pointerdown", e => {
      down = true; sx = e.clientX; sy = e.clientY; dx = 0; swiping = false; fired = false; cancel();
      if(ui.select) return;
      timer = setTimeout(() => {
        timer = null;
        if(!count || swiping) return;
        fired = true;
        b.classList.add("selected");
        try{ navigator.vibrate && navigator.vibrate(25); }catch(_){}
      }, 480);
    });
    b.addEventListener("pointermove", e => {
      if(!down) return;
      const mx = e.clientX - sx, my = e.clientY - sy;
      if(timer && Math.hypot(mx, my) > 10) cancel();
      if(!swiping && !fired && mx > 12 && Math.abs(mx) > Math.abs(my) * 1.3){
        swiping = true;
        try{ b.setPointerCapture(e.pointerId); }catch(_){}
      }
      if(swiping){
        dx = Math.max(0, Math.min(170, mx));
        movers().forEach(r => {
          const rb = bgOf(r);
          r.style.transform = "translateX(" + dx + "px)";
          rb.style.opacity = Math.min(1, dx / 90);
          rb.classList.toggle("ready", dx >= 90);
        });
      }
    });
    b.addEventListener("pointerup", finish);
    b.addEventListener("pointercancel", () => { if(swiping){ swiping = false; down = false; reset(); } else finish(); });
    b.addEventListener("contextmenu", e => e.preventDefault());
    b.onclick = () => {
      if(swallow) return;
      if(ui.select){
        if(!count) return;
        if(ui.select.has(id)) ui.select.delete(id); else ui.select.add(id);
        if(!ui.select.size) ui.select = null;
        rerender(); return;
      }
      ui.groupId = id; ui.editMode = false; go("#gruppe");
    };
  });
  if(sel){
    document.getElementById("mixCancel").onclick = () => { ui.select = null; rerender(); };
  }
  const newGroupFn = async () => {
    const r = await ask({ title:"Neue Gruppe", fields:[{name:"name", label:"Name der Gruppe", placeholder:"z. B. Unit 2 – Animals"}], ok:"Gruppe anlegen" });
    if(!r || !norm(r.name)) return;
    const g = { id: uid(), name: norm(r.name), created: Date.now(), order: [], stars: 0, medals: {}, grade: S.settings.grade, lang: S.settings.lang || "en" };
    S.groups.push(g); save();
    ui.groupId = g.id; ui.editMode = true; go("#gruppe");
  };
  document.getElementById("addGroupTop").onclick = newGroupFn;
  document.getElementById("gradeBtn").onclick = () => { ui.select = null; go("#klasse"); };
  document.getElementById("langBtn").onclick = async () => {
    const c = await choose("Welche Sprache lernst du?", "", Object.values(LANGS).map(x => ({ value: x.key, label: x.flag + " " + x.name + (x.key === lang ? " ✓" : ""), primary: x.key === lang })));
    if(!c) return;
    S.settings.lang = c; ui.select = null; save(); renderHome();
  };
  if(ui.homeNote){
    const n = document.createElement("div");
    n.className = "note info"; n.setAttribute("role", "status"); n.textContent = ui.homeNote; ui.homeNote = null;
    const list = app.querySelector(".list, .empty"); if(list) list.before(n);
  }
  document.getElementById("openBackup").onclick = () => go("#sicherung");
  document.getElementById("openInfo").onclick = () => go("#info");
  document.getElementById("openGarage").onclick = () => go("#werkstatt");
  window.scrollTo(0,0);
}

function starPath(x, y, r){
  let d = "";
  for(let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; d += (i ? "L" : "M") + (x + rr * Math.cos(a)).toFixed(1) + "," + (y + rr * Math.sin(a)).toFixed(1); }
  return d + "Z";
}
function engineSound(level){
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const ctx = new AC(), t = ctx.currentTime, dur = 1.1 - level * .12;
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = "sawtooth"; f.type = "lowpass"; f.frequency.value = 500 + level * 350;
    const base = 48 + level * 14;
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base * (2.2 + level * .4), t + dur * .45);
    o.frequency.exponentialRampToValueAtTime(base * 1.1, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16, t + .05); g.gain.linearRampToValueAtTime(.12, t + dur * .6); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(f); f.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + .05);
    setTimeout(() => ctx.close(), (dur + .3) * 1000);
  }catch(e){}
}
function driveCar(svg, level){
  if(!svg || svg.dataset.driving) return;
  svg.dataset.driving = "1";
  const dur = [1200, 950, 750][level - 1] || 1200, dist = [60, 90, 120][level - 1] || 60;
  const body = svg.querySelector(".car-body");
  const all = [svg.querySelector(".car-body"), ...svg.querySelectorAll(".car-wheel")];
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  engineSound(level);
  const fl = svg.querySelector(".car-flames"); if(fl) fl.classList.add("on");
  if(!reduce){
    svg.animate([{ transform:"translateX(0)" }, { transform:"translateX(-6px)", offset:.12 }, { transform:`translateX(${dist}px)`, offset:.6 }, { transform:"translateX(0)" }], { duration: dur, easing:"ease-in-out" });
    body.animate([{ transform:"rotate(0)" }, { transform:"rotate(-2deg)", offset:.2 }, { transform:"rotate(0)", offset:.6 }, { transform:"rotate(0)" }], { duration: dur });
    svg.querySelectorAll(".car-wheel").forEach(w => w.animate([{ transform:"rotate(0)" }, { transform:"rotate(720deg)" }], { duration: dur, easing:"ease-in-out" }));
  }
  const puff = document.createElementNS("http://www.w3.org/2000/svg", "g");
  svg.appendChild(puff);
  for(let i = 0; i < 4; i++){
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", "0"); c.setAttribute("cy", "128"); c.setAttribute("r", "8"); c.setAttribute("fill", "#C9D1D9");
    puff.appendChild(c);
    if(!reduce) c.animate([{ transform:"translate(0,0) scale(.4)", opacity:.8 }, { transform:`translate(${-40 - i * 14}px,${-8 - i * 4}px) scale(${1.4 + i * .3})`, opacity:0 }], { duration: 700 + i * 120, delay: i * 90, fill:"forwards" });
  }
  setTimeout(() => { puff.remove(); if(fl) fl.classList.remove("on"); delete svg.dataset.driving; }, dur + 400);
}

/* ---------- Texterkennung direkt auf dem Handy (eigene Adresse, z. B. GitHub Pages) ---------- */
const OCR_BASE = "ocr/";
let ocrScript = null;
function ocrAvailable(){ return !window.claude && location.protocol.startsWith("http"); }
function ocrUrl(name){ return new URL(OCR_BASE + name, location.href).href; }
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(!ocrScript) ocrScript = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = ocrUrl("tesseract.min.js");
    sc.onload = res; sc.onerror = () => { ocrScript = null; rej(new Error("load")); };
    document.head.appendChild(sc);
  });
  return ocrScript;
}
// Foto vorbereiten: verkleinern, Graustufen, Kontrast verstärken
function prepForOcr(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 2000, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const cx = c.getContext("2d");
      cx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const d = cx.getImageData(0, 0, c.width, c.height), p = d.data;
      let lo = 255, hi = 0;
      for(let i = 0; i < p.length; i += 16){ const v = .299 * p[i] + .587 * p[i+1] + .114 * p[i+2]; if(v < lo) lo = v; if(v > hi) hi = v; }
      const span = Math.max(40, hi - lo);
      for(let i = 0; i < p.length; i += 4){
        let v = .299 * p[i] + .587 * p[i+1] + .114 * p[i+2];
        v = Math.max(0, Math.min(255, (v - lo) * 255 / span));
        p[i] = p[i+1] = p[i+2] = v;
      }
      cx.putImageData(d, 0, 0);
      resolve(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}
// Erkannte Wörter in Spalten aufteilen. Gibt es drei Spalten (z. B. mit Lautschrift),
// zählen nur die erste und die letzte.
function ocrToPairs(data){
  const lines = (data.lines || []).map(l => (l.words || []).filter(w => w.text && /[A-Za-zÀ-ÖØ-öø-ſ]/.test(w.text) && w.confidence > 25))
    .filter(ws => ws.length);
  if(!lines.length) return null;
  const all = [].concat.apply([], lines);
  const minX = Math.min(...all.map(w => w.bbox.x0)), maxX = Math.max(...all.map(w => w.bbox.x1));
  const extent = Math.max(1, maxX - minX), BIN = 4, n = Math.ceil(extent / BIN) + 1;
  const cover = new Array(n).fill(0);
  all.forEach(w => { for(let x = Math.floor((w.bbox.x0 - minX) / BIN); x <= Math.floor((w.bbox.x1 - minX) / BIN); x++) cover[x]++; });
  // freie senkrechte Streifen finden (kleine Ausreißer zulassen)
  const limit = Math.max(1, Math.floor(lines.length * .12));
  const gaps = []; let start = -1;
  for(let i = 0; i <= n; i++){
    const free = i < n && cover[i] <= limit;
    if(free && start < 0) start = i;
    if(!free && start >= 0){ if((i - start) * BIN >= extent * .04) gaps.push({ a: start * BIN + minX, b: i * BIN + minX }); start = -1; }
  }
  const inner = gaps.filter(g => g.a > minX + extent * .1 && g.b < maxX - extent * .1);
  if(!inner.length){
    // keine klaren Spalten: Zeilen als Text auswerten
    return parseOne(lines.map(ws => ws.map(w => w.text).join(" ")).join("\n"));
  }
  const cut1 = (inner[0].a + inner[0].b) / 2, cut2 = (inner[inner.length - 1].a + inner[inner.length - 1].b) / 2;
  const L = [], R = [];
  lines.forEach(ws => {
    const mid = w => (w.bbox.x0 + w.bbox.x1) / 2;
    const left = ws.filter(w => mid(w) < cut1).map(w => w.text).join(" ").trim();
    const right = ws.filter(w => mid(w) > cut2).map(w => w.text).join(" ").trim();
    if(left && right){ L.push(left); R.push(right); }
    else if(right && R.length && !left){ R[R.length - 1] += " " + right; }      // umgebrochene Übersetzung
    else if(left && L.length && !right && ws.length < 4 && R.length === L.length){ L[L.length - 1] += " " + left; }
  });
  if(!L.length) return parseOne(lines.map(ws => ws.map(w => w.text).join(" ")).join("\n"));
  const fix = arr => arr.map(t => cleanLines(t)[0] || t.trim());
  return Object.assign(orientPairs(fix(L), fix(R)), { how:"photo" });
}

async function readPhotoLocal(file, g, status){
  let worker = null, stopped = false;
  status.innerHTML = `<div class="photo-busy"><span class="spin" aria-hidden="true">📷</span>
    <span><strong>Foto wird gelesen …</strong><br><span class="muted" id="ocrProg">Texterkennung startet</span></span>
    <button class="btn ghost small" id="photoStop">Stopp</button></div>`;
  const prog = () => document.getElementById("ocrProg");
  document.getElementById("photoStop").onclick = () => { stopped = true; if(worker) worker.terminate(); status.innerHTML = ""; };
  try{
    await loadTesseract();
    if(stopped) return;
    PARSE_LANG = groupLang(g).key;
    worker = await Tesseract.createWorker([groupLang(g).ocr, "deu"], 1, {
      workerPath: ocrUrl("worker.min.js"), corePath: ocrUrl(""), langPath: ocrUrl(""), workerBlobURL: false,
      logger: m => {
        const el = prog(); if(!el) return;
        const pct = Math.round((m.progress || 0) * 100);
        if(m.status === "loading language traineddata") el.textContent = `Sprachdaten laden … ${pct} % (nur beim ersten Mal)`;
        else if(m.status === "recognizing text") el.textContent = `Text erkennen … ${pct} %`;
      }
    });
    if(stopped) return;
    await worker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" });
    const canvas = await prepForOcr(file);
    const { data } = await worker.recognize(canvas);
    await worker.terminate(); worker = null;
    if(stopped) return;
    const p = ocrToPairs(data);
    if(!p || !(p.en.length || p.de.length)){
      status.innerHTML = `<div class="note warn">Auf dem Foto wurden keine Vokabeln gefunden. Fotografiere die Liste gerade, hell und möglichst nah.</div>`;
      return;
    }
    p.how = "photo";
    ui.imp = { mode:"one", text:"", enText:"", deText:"", preview: p };
    go("#import");
  }catch(e){
    if(worker) try{ worker.terminate(); }catch(_){}
    if(stopped) return;
    status.innerHTML = `<div class="note warn">Die Texterkennung konnte nicht starten. Beim ersten Mal braucht sie Internet, um die Sprachdaten zu laden. Versuch es noch einmal.</div>`;
  }
}

/* ---------- Wasser-Weg: Rohr-Labyrinth ---------- */
const PX = [60, 180, 300], P_TOP = 74, P_BOTTOM = 440;
function makePipes(){
  const pairs = [[0,1],[1,2],[0,2]];
  let swaps, final, n = 0;
  do {
    swaps = []; let prev = -1;
    for(let k = 0; k < 6; k++){
      let i; do { i = Math.floor(Math.random() * 3); } while(i === prev);
      prev = i; swaps.push(pairs[i]);
    }
    final = [0,1,2].map(f => { let lane = f; swaps.forEach(([a,b]) => { lane = lane === a ? b : lane === b ? a : lane; }); return lane; });
  } while(final.every((l, f) => l === f) && n++ < 20);
  return { swaps, final };
}
function pipePath(st, f){
  const h = (P_BOTTOM - P_TOP) / st.swaps.length;
  let lane = f, d = `M ${PX[lane]} 58 L ${PX[lane]} ${P_TOP}`;
  st.swaps.forEach(([a, b], k) => {
    const y0 = P_TOP + k * h, y1 = y0 + h;
    const nl = lane === a ? b : lane === b ? a : lane;
    d += nl === lane ? ` L ${PX[lane]} ${y1}` : ` C ${PX[lane]} ${y0 + h * .55}, ${PX[nl]} ${y0 + h * .45}, ${PX[nl]} ${y1}`;
    lane = nl;
  });
  return d + ` L ${PX[lane]} 458`;
}
function pipesSVG(st){
  const order = st.drawOrder || (st.drawOrder = shuffle([0,1,2]));
  const pipes = order.map(f => {
    const d = pipePath(st, f);
    return `<g class="pipe">
      <path d="${d}" class="p-gap"/><path d="${d}" class="p-body"/><path d="${d}" class="p-shine"/>
      <path d="${d}" class="water" data-f="${f}"/>
    </g>`;
  }).join("");
  const taps = [0,1,2].map(f => `
    <g class="tap" data-f="${f}" role="button" tabindex="0" aria-label="Wasserhahn ${f + 1}">
      <rect x="${PX[f] - 40}" y="0" width="80" height="66" fill="transparent"/>
      <rect x="${PX[f] - 8}" y="34" width="16" height="26" rx="4" class="tap-metal"/>
      <rect x="${PX[f] - 22}" y="24" width="44" height="16" rx="8" class="tap-metal"/>
      <g class="handle" style="transform-origin:${PX[f]}px 18px">
        <rect x="${PX[f] - 18}" y="14" width="36" height="9" rx="4.5" class="tap-red"/>
        <rect x="${PX[f] - 4.5}" y="4" width="9" height="28" rx="4.5" class="tap-red"/>
        <circle cx="${PX[f]}" cy="18" r="6" class="tap-cap"/>
      </g>
      <text x="${PX[f]}" y="${70}" class="tap-num">${f + 1}</text>
    </g>`).join("");
  const basins = [0,1,2].map(l => `
    <g class="basin" data-l="${l}">
      <clipPath id="bc${l}"><rect x="${PX[l] - 54}" y="458" width="108" height="56" rx="12"/></clipPath>
      <rect x="${PX[l] - 54}" y="458" width="108" height="56" rx="12" class="b-box"/>
      <rect x="${PX[l] - 54}" y="458" width="108" height="56" clip-path="url(#bc${l})" class="b-fill"/>
      <text x="${PX[l]}" y="487" class="b-word">${esc(st.options[l])}</text>
      <text x="${PX[l]}" y="448" class="b-flower">🌻</text>
      <text x="${PX[l] + 46}" y="464" class="b-mark">✗</text>
    </g>`).join("");
  return `<svg id="pipes" viewBox="0 0 360 520" role="img" aria-label="Rohr-Labyrinth mit drei Wasserhähnen">${pipes}${taps}${basins}</svg>`;
}
function runPipes(st, ans, onResult){
  const svg = document.getElementById("pipes");
  svg.querySelectorAll(".water").forEach(p => {
    const L = p.getTotalLength();
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
  });
  svg.querySelectorAll(".b-word").forEach(t => {
    let fs = 17; t.setAttribute("font-size", fs);
    while(t.getComputedTextLength() > 98 && fs > 9){ fs--; t.setAttribute("font-size", fs); }
  });
  const correctF = st.final.findIndex(l => st.options[l] === ans);
  const flow = (f, quick) => new Promise(res => {
    const tap = svg.querySelector(`.tap[data-f="${f}"]`), water = svg.querySelector(`.water[data-f="${f}"]`);
    tap.classList.add("open");
    const dur = quick ? 1.4 : 2.4;
    water.getBoundingClientRect();
    water.style.transition = `stroke-dashoffset ${dur}s linear`;
    water.style.strokeDashoffset = "0";
    setTimeout(() => {
      const basin = svg.querySelector(`.basin[data-l="${st.final[f]}"]`);
      basin.classList.add("full");
      setTimeout(res, 500);
    }, dur * 1000);
  });
  const pick = f => {
    if(st.finished || st.running) return;
    st.running = true;
    svg.classList.add("busy");
    flow(f).then(() => {
      const basin = svg.querySelector(`.basin[data-l="${st.final[f]}"]`);
      if(f === correctF){ basin.classList.add("win"); onResult(true); }
      else {
        basin.classList.add("lose");
        setTimeout(() => flow(correctF, true).then(() => {
          svg.querySelector(`.basin[data-l="${st.final[correctF]}"]`).classList.add("win");
          onResult(false);
        }), 350);
      }
    });
  };
  svg.querySelectorAll(".tap").forEach(t => {
    t.addEventListener("click", () => pick(+t.dataset.f));
    t.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(+t.dataset.f); } });
  });
}

/* ---------- Wort-Gipfel: kleines Jump-and-Run ---------- */
const HEROES = ["🦊", "🤖", "🧑‍🚀", "🐰"];
function startClimb(st, ans, onResult){
  const canvas = document.getElementById("climb");
  const ctx = canvas.getContext("2d");
  const W = 360;                       // Spielwelt ist immer 360 breit und wird skaliert
  const GAP = 92, STEPS = 5, GROUND = 40;
  const worldH = GROUND + GAP * (STEPS + 1) + 120;
  const groundY = worldH - GROUND;
  const topY = groundY - GAP * (STEPS + 1);
  const font = '"Baloo 2","Trebuchet MS",system-ui,sans-serif';
  const s = ui.session;
  if(!st.hero) st.hero = HEROES[Math.floor(Math.random() * HEROES.length)];

  // Level aufbauen
  const plats = [{ x:0, y:groundY, w:W, kind:"ground" }];
  const coins = [];
  let cx = W / 2;
  for(let i = 1; i <= STEPS; i++){
    const w = 84 + Math.random() * 26;
    let nx;
    if(i === STEPS) nx = W / 2 + (Math.random() * 40 - 20);
    else { let tries = 0; do { nx = 60 + Math.random() * (W - 120); tries++; } while((Math.abs(nx - cx) < 55 || Math.abs(nx - cx) > 150) && tries < 30); }
    cx = nx;
    const y = groundY - GAP * i;
    plats.push({ x: cx - w / 2, y, w, kind:"step" });
    coins.push({ x: cx, y: y - 26, got:false });
    if(Math.random() < .6) coins.push({ x: Math.max(24, Math.min(W - 24, cx + (Math.random() < .5 ? -1 : 1) * (40 + Math.random() * 50))), y: y - GAP / 2 - 10, got:false });
  }
  const tw = 100, centers = [62, W / 2, W - 62];
  const targets = st.options.map((word, i) => ({ x: centers[i] - tw / 2, y: topY, w: tw, kind:"target", word, right: word === ans, broken:false }));
  plats.push(...targets);
  [50, 100, W - 100, W - 50].forEach(x => coins.push({ x, y: groundY - 24, got:false })); // nicht dort, wo die Figur startet

  const p = { x: W / 2, y: groundY, vx:0, vy:0, w:26, h:30, onGround:true, face:1 };
  const keys = { left:false, right:false }; let jumpAt = -1, over = false, overAt = 0, camY = worldH, scale = 1, viewH = 400;
  const pops = [];
  let sessionCoins = s.coins || 0;

  function resize(){
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    scale = r.width / W; viewH = r.height / scale;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  }
  resize();
  camY = worldH - viewH;

  // Steuerung
  const hold = (id, key) => {
    const b = document.getElementById(id);
    const on = e => { e.preventDefault(); keys[key] = true; try{ b.setPointerCapture(e.pointerId); }catch(_){} b.classList.add("down"); };
    const off = () => { keys[key] = false; b.classList.remove("down"); };
    b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off);
    b.addEventListener("pointercancel", off); b.addEventListener("lostpointercapture", off);
    b.addEventListener("contextmenu", e => e.preventDefault());
  };
  hold("cLeft", "left"); hold("cRight", "right");
  const jb = document.getElementById("cJump");
  jb.addEventListener("pointerdown", e => { e.preventDefault(); jumpAt = performance.now(); jb.classList.add("down"); });
  ["pointerup","pointercancel","pointerleave"].forEach(t => jb.addEventListener(t, () => jb.classList.remove("down")));
  jb.addEventListener("contextmenu", e => e.preventDefault());
  const kd = e => {
    if(!document.body.contains(canvas)){ window.removeEventListener("keydown", kd); window.removeEventListener("keyup", ku); return; }
    if(e.key === "ArrowLeft") keys.left = true;
    if(e.key === "ArrowRight") keys.right = true;
    if(e.key === "ArrowUp" || e.key === " "){ e.preventDefault(); jumpAt = performance.now(); }
  };
  const ku = e => { if(e.key === "ArrowLeft") keys.left = false; if(e.key === "ArrowRight") keys.right = false; };
  window.addEventListener("keydown", kd); window.addEventListener("keyup", ku);

  function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function step(dt){
    const SPEED = 190, G = 1850, JUMP = 690;
    p.vx = (keys.right ? SPEED : 0) - (keys.left ? SPEED : 0);
    if(p.vx) p.face = p.vx > 0 ? 1 : -1;
    if(jumpAt > 0 && performance.now() - jumpAt < 160 && p.onGround && !over){ p.vy = -JUMP; p.onGround = false; jumpAt = -1; }
    if(over && st.won){ p.vx = 0; }
    p.vy = Math.min(p.vy + G * dt, 1100);
    const prevBottom = p.y;
    p.x = Math.max(p.w / 2, Math.min(W - p.w / 2, p.x + p.vx * dt));
    p.y += p.vy * dt;
    p.onGround = false;
    if(p.vy >= 0){
      for(const pl of plats){
        if(pl.broken) continue;
        if(p.x + p.w / 2 - 4 > pl.x && p.x - p.w / 2 + 4 < pl.x + pl.w && prevBottom <= pl.y + 1 && p.y >= pl.y){
          p.y = pl.y; p.vy = 0; p.onGround = true;
          if(pl.kind === "target" && !over) landOn(pl);
          break;
        }
      }
    }
    for(const c of coins){
      if(!c.got && Math.abs(c.x - p.x) < 20 && Math.abs(c.y - (p.y - p.h / 2)) < 24){
        c.got = true; sessionCoins++; s.coins = sessionCoins;
        pops.push({ x:c.x, y:c.y, t:0 });
      }
    }
    pops.forEach(o => o.t += dt);
    const target = p.y - viewH * .6;
    camY += (Math.max(0, Math.min(worldH - viewH, target)) - camY) * Math.min(1, dt * 6);
  }

  function landOn(pl){
    over = true; overAt = performance.now();
    if(pl.right){ st.won = true; onResult(true); }
    else {
      pl.cracking = performance.now();
      setTimeout(() => { pl.broken = true; targets.forEach(t => { if(t.right) t.glow = true; }); }, 350);
      setTimeout(() => onResult(false), 900);
    }
  }

  function draw(){
    const sky = ctx.createLinearGradient(0, 0, 0, viewH);
    const h = Math.max(0, Math.min(1, camY / (worldH - viewH || 1)));
    sky.addColorStop(0, `hsl(${205 + 25 * (1 - h)}, 75%, ${58 + 10 * h}%)`);
    sky.addColorStop(1, `hsl(195, 70%, ${80 + 6 * h}%)`);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, viewH);
    ctx.save(); ctx.translate(0, -camY);
    // Wolken
    ctx.fillStyle = "rgba(255,255,255,.75)";
    [[60, 120], [270, 260], [120, 420], [300, 560], [70, 690]].forEach(([x, y]) => {
      ctx.beginPath(); ctx.ellipse(x, y, 38, 14, 0, 0, Math.PI * 2); ctx.ellipse(x + 22, y - 8, 24, 13, 0, 0, Math.PI * 2); ctx.fill();
    });
    // Plattformen
    for(const pl of plats){
      if(pl.broken) continue;
      let shake = 0;
      if(pl.cracking) shake = Math.sin(performance.now() / 30) * 3;
      if(pl.kind === "ground"){
        ctx.fillStyle = "#7a5230"; ctx.fillRect(0, pl.y, W, GROUND + 200);
        ctx.fillStyle = "#58b947"; ctx.fillRect(0, pl.y, W, 10);
      } else if(pl.kind === "step"){
        ctx.fillStyle = "#8a5a33"; roundRect(pl.x, pl.y, pl.w, 16, 6); ctx.fill();
        ctx.fillStyle = "#5fc24c"; roundRect(pl.x, pl.y, pl.w, 7, 4); ctx.fill();
      } else {
        const x = pl.x + shake;
        if(pl.glow){ ctx.save(); ctx.shadowColor = "#ffe066"; ctx.shadowBlur = 22; }
        ctx.fillStyle = pl.glow || (st.won && pl.right) ? "#ffd43b" : "#c98b4b"; roundRect(x, pl.y, pl.w, 18, 6); ctx.fill();
        if(pl.glow) ctx.restore();
        ctx.fillStyle = "rgba(0,0,0,.18)"; for(let k = 1; k < 4; k++) ctx.fillRect(x + k * pl.w / 4, pl.y + 3, 2, 12);
        // Schild mit dem Wort
        let fs = 16; ctx.font = `800 ${fs}px ${font}`;
        while(ctx.measureText(pl.word).width > pl.w - 6 && fs > 10){ fs--; ctx.font = `800 ${fs}px ${font}`; }
        const tw2 = Math.min(pl.w + 6, ctx.measureText(pl.word).width + 14);
        ctx.fillStyle = "rgba(255,255,255,.95)"; roundRect(x + pl.w / 2 - tw2 / 2, pl.y - 30 - fs, tw2, fs + 12, 8); ctx.fill();
        ctx.fillStyle = "#1b2a26"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(pl.word, x + pl.w / 2, pl.y - 24 - fs / 2 + 1, pl.w + 2);
        if(st.won && pl.right){ ctx.font = `30px ${font}`; ctx.fillText("🚩", x + pl.w - 14, pl.y - 52 - fs); }
      }
    }
    // Münzen
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = `20px ${font}`;
    const bob = Math.sin(performance.now() / 250) * 3;
    coins.forEach(c => { if(!c.got) ctx.fillText("🪙", c.x, c.y + bob); });
    pops.forEach(o => { if(o.t < .8){ ctx.globalAlpha = 1 - o.t / .8; ctx.font = `800 16px ${font}`; ctx.fillStyle = "#b8860b"; ctx.fillText("+1", o.x, o.y - o.t * 40); ctx.globalAlpha = 1; } });
    // Figur
    ctx.save(); ctx.translate(p.x, p.y - p.h / 2 + 2); if(p.face < 0) ctx.scale(-1, 1);
    const squash = p.onGround ? 1 : 1.06;
    ctx.scale(1 / squash, squash);
    ctx.font = `32px ${font}`; ctx.fillText(st.hero, 0, 0);
    ctx.restore();
    if(st.won){ ctx.font = `28px ${font}`; ctx.fillText("🎉", p.x + 22, p.y - 48); }
    ctx.restore();
    // Anzeige
    ctx.fillStyle = "rgba(255,255,255,.85)"; roundRect(8, 8, 74, 30, 12); ctx.fill();
    ctx.fillStyle = "#1b2a26"; ctx.font = `800 17px ${font}`; ctx.textAlign = "left"; ctx.fillText(`🪙 ${sessionCoins}`, 16, 24);
    if(camY > worldH - viewH - 40 && !over){
      ctx.textAlign = "center"; ctx.font = `700 13px ${font}`; ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.fillText("Spring nach oben zur richtigen Übersetzung!", W / 2, 54);
    }
  }

  let last = performance.now();
  function loop(now){
    if(!document.body.contains(canvas)) return;   // Spiel beendet, sobald die Karte wechselt
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    if(canvas.getBoundingClientRect().width / W !== scale) resize();
    step(dt); draw();
    if(over && now - overAt > 6000) return;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
