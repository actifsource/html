/* ---------- Foto lesen (über Claude, nur auf claude.ai) ---------- */
const PHOTO = { ok: null, sample: null };
(async () => {
  try{
    const s = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("sample") : null;
    const caps = s ? await s.limits().catch(() => null) : null;
    PHOTO.sample = s; PHOTO.ok = !!(caps && caps.images); PHOTO.maxBytes = caps && caps.images ? caps.images.maxInputBytes : 0;
  }catch(e){ PHOTO.ok = false; }
})();

function shrinkImage(file){
  return new Promise(resolve => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1800, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => resolve(b || file), "image/jpeg", .85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

async function readPhoto(file, g, status){
  if(PHOTO.ok !== true) return readPhotoLocal(file, g, status);
  const ctl = new AbortController();
  status.innerHTML = `<div class="photo-busy"><span class="spin" aria-hidden="true">📷</span>
    <span><strong>Foto wird gelesen …</strong><br><span class="muted">Das dauert etwa 10 bis 40 Sekunden.</span></span>
    <button class="btn ghost small" id="photoStop">Stopp</button></div>`;
  document.getElementById("photoStop").onclick = () => ctl.abort();
  const L = groupLang(g), fr = L.key === "fr";
  const prompt = `Das Bild zeigt eine Vokabelliste aus einem ${L.name}-Schulbuch mit ${L.adj}n Wörtern und ihrer deutschen Übersetzung. ` +
    "Lies alle Vokabelpaare der Reihe nach von oben nach unten ab. Lass Lautschrift, Seitenzahlen, Überschriften und Beispielsätze weg. " +
    `Übernimm die Wörter genau so, wie sie gedruckt sind, mit allen Akzenten, ${fr ? "auch Artikel wie „le“, „la“, „l’“" : "auch „to“ bei Verben"} und Artikel wie „der“, „die“, „das“. ` +
    "Handschriftliche Notizen nur übernehmen, wenn sie klar ein Vokabelpaar sind. " +
    `Antworte nur mit einem JSON-Array. Das Feld "fremd" ist das ${L.adj} Wort, "de" die deutsche Übersetzung, zum Beispiel ` +
    (fr ? '[{"fremd":"le chien","de":"der Hund"},{"fremd":"aller","de":"gehen"}]' : '[{"fremd":"dog","de":"Hund"},{"fremd":"to go","de":"gehen"}]') +
    ". Wenn du keine Vokabeln findest, antworte mit [].";
  try{
    const blob = await shrinkImage(file);
    const data = await PHOTO.sample.json(prompt, { images: [blob], signal: ctl.signal });
    const rows = Array.isArray(data) ? data.filter(x => x && typeof x === "object")
      .map(x => ({ en: norm(String(x.fremd || x.en || x.fr || "")), de: norm(String(x.de || "")) })).filter(x => x.en || x.de) : [];
    if(!rows.length){
      status.innerHTML = `<div class="note warn">Auf dem Foto wurden keine Vokabeln gefunden. Versuch es mit einem schärferen Foto, auf dem nur die Liste zu sehen ist.</div>`;
      return;
    }
    ui.imp = { mode:"one", text:"", enText:"", deText:"", preview:{ en: rows.map(r => r.en), de: rows.map(r => r.de), swapped:false, how:"photo" } };
    go("#import");
  }catch(e){
    const code = e && e.code;
    if(code === "cancelled"){ status.innerHTML = ""; return; }
    const text = code === "not_granted" ? "Die Fotoerkennung wurde nicht erlaubt. Du kannst stattdessen 📋 Liste einfügen nutzen."
      : code === "rate_limited" || code === "queue_overflow" ? "Gerade sind zu viele Anfragen unterwegs. Bitte kurz warten und noch einmal versuchen."
      : code === "image_rejected" ? "Dieses Bild konnte nicht verwendet werden. Versuch es mit einem normalen Foto."
      : code === "images_unavailable" || code === "sampling_disabled" ? "Die Fotoerkennung funktioniert hier nicht. Nutze 📋 Liste einfügen."
      : "Das Foto konnte nicht gelesen werden. Versuch es noch einmal.";
    status.innerHTML = `<div class="note warn">${text}</div>`;
  }
}

/* ---------- Üben mit dem Stapel ----------
   Die vorderste Karte wird beantwortet und wieder einsortiert:
   nicht gewusst -> gleich hinter die nächsten 2 Karten,
   gewusst      -> je sicherer, desto weiter nach hinten. */
function sortBackPosition(level, len){
  if(level === 0) return Math.min(2, len);
  return Math.min(len, Math.pow(2, level + 1)); // 4, 8, 16, 32, 64
}

function startSession(mixIds){
  let stack, mix = null;
  if(mixIds && mixIds.length){
    // Mehrere Gruppen: ein gemeinsamer Stapel, unsichere Karten zuerst, gleicher Lernstand zufällig gemischt
    mix = mixIds.slice();
    const dir = ui.dir;
    const lv = w => dir === "mix" ? Math.min(w.level.ende, w.level.deen) : w.level[dir];
    stack = shuffle(S.words.filter(w => mix.includes(w.groupId))).sort((a, b) => lv(a) - lv(b)).map(w => w.id);
  } else stack = stackOf(group(ui.groupId));
  save();
  ui.session = { target: stack.length, done: 0, firstTry: 0, missed: new Set(), doneSet: new Set(),
    flipped: false, dir: null, type: null, lastType: null, mode: modeOf(S.settings.mode).key, state: null,
    mix, mixStack: mix ? stack : null, perGroup: {} };
  pickDir();
  go("#lernen");
}
function sessionStack(){ const s = ui.session; return s.mixStack || stackOf(group(ui.groupId)); }
function pickDir(){
  const s = ui.session;
  s.dir = ui.dir === "mix" ? (Math.random() < .5 ? "ende" : "deen") : ui.dir;
  s.lastType = s.type; s.type = null; s.state = null; s.flipped = false;
}

/* ---------- Profi-Modus: Aufgabenarten ---------- */
const TYPES = {
  flip:     { icon:"🃏", name:"Karte umdrehen" },
  typing:   { icon:"⌨️", name:"Eintippen" },
  choice:   { icon:"🎯", name:"Richtig antippen" },
  scramble: { icon:"🔤", name:"Buchstabensalat" },
  letters:  { icon:"🔤", name:"Buchstaben" },
  frog:     { icon:"🐸", name:"Frosch-Sprung" },
  climb:    { icon:"⛰️", name:"Wort-Gipfel" },
  pipes:    { icon:"🚰", name:"Wasser-Weg" }
};
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function answerOf(w, dir){ return dir === "ende" ? w.de : w.en; }
function promptOf(w, dir){ return dir === "ende" ? w.en : w.de; }
function distractors(w, dir, n){
  const mine = answerOf(w, dir).toLowerCase();
  const fromGroup = wordsOf(w.groupId).filter(x => x.id !== w.id);
  let pool = fromGroup.map(x => answerOf(x, dir));
  if(pool.length < n){
    const lang = wordLang(w).key;   // nur Wörter derselben Sprache als falsche Antworten
    pool = pool.concat(S.words.filter(x => x.groupId !== w.groupId && wordLang(x).key === lang).map(x => answerOf(x, dir)));
  }
  const seen = new Set([mine]), out = [];
  shuffle(pool).forEach(t => { const k = t.toLowerCase(); if(out.length < n && !seen.has(k)){ seen.add(k); out.push(t); } });
  return out;
}
function chooseType(w, dir){
  const ans = answerOf(w, dir), letters = ans.replace(/\s/g, "");
  const ok = ["flip", "typing"];
  if(stripParens(ans).replace(/\s/g, "").length >= 2) ok.push("letters");   // Buchstaben in der richtigen Reihenfolge antippen
  if(distractors(w, dir, 2).length >= 2){ ok.push("choice", "frog", "climb", "pipes"); }
  const s = ui.session;
  const pick = ok.filter(t => t !== s.lastType);
  const list = pick.length ? pick : ok;
  return list[Math.floor(Math.random() * list.length)];
}
// Groß/Klein egal, Leerzeichen und Satzzeichen am Ende egal, „to“ vor Verben optional,
// bei „groß, hoch“ oder „groß / hoch“ zählt auch eine Variante.
function simple(t){ return t.toLowerCase().replace(/[’`]/g, "'").replace(/[.!?]+$/,"").replace(/\s+/g," ").trim().replace(/^to /, ""); }
function deaccent(t){ return t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/œ/g, "oe").replace(/æ/g, "ae"); }
// Was in Klammern steht, z. B. „(sich) freuen“ oder „to look (at)“, muss nicht getippt werden
function stripParens(t){ return String(t).replace(/\s*\([^)]*\)\s*/g, " ").replace(/\s+/g, " ").trim(); }
function isCorrect(input, answer, loose){
  const a = simple(stripParens(input));
  if(!a) return false;
  const same = (x, y) => x === y || (loose && deaccent(x) === deaccent(y));
  // gilt ohne den Klammer-Teil und auch mit ihm (dann ohne die Klammern selbst)
  return [stripParens(answer), answer.replace(/[()]/g, "")].some(ans => {
    if(same(a, simple(ans))) return true;
    return ans.split(/\s*[,/;]\s*/).some(part => part && same(simple(part), a));
  });
}

function renderLearn(entering){
  const s = ui.session;
  if(!s.mix && !group(ui.groupId)){ ui.session = null; return go("#start", true); }
  const stack = sessionStack();
  const w = wordById(stack[0]);
  if(!w){ ui.session = null; return go(s.mix ? "#start" : "#gruppe", true); }
  if(!s.type) s.type = s.mode === "profi" ? chooseType(w, s.dir) : s.mode === "tipp" ? "typing" : s.mode === "letters" ? "letters" : "flip";
  const head = `
    <div class="topbar">
      <button class="back" id="quit">✕ Beenden</button>
      <span class="muted" style="font-weight:700">${modeOf(s.mode).icon} ${s.done} / ${s.target}</span>
    </div>
    <div class="progress" aria-hidden="true"><span style="width:${s.done/s.target*100}%"></span></div>
    ${s.mix ? `<p class="task-type mix-from">🔀 Mix · aus „${esc((group(w.groupId) || {}).name || "")}“</p>` : ""}
    ${s.mode === "profi" ? `<p class="task-type">${TYPES[s.type].icon} ${TYPES[s.type].name}</p>` : ""}`;
  if(s.type === "flip") renderFlip(head, w, stack, entering);
  else renderChallenge(head, w);
  document.getElementById("quit").onclick = () => { const m = s.mix; ui.session = null; if(m) ui.mixIds = m; go(m ? "#mix" : "#gruppe", true); };
}

function renderFlip(head, w, stack, entering){
  const s = ui.session, askEn = s.dir === "ende";
  const front = promptOf(w, s.dir), back = answerOf(w, s.dir);
  const WL = wordLang(w), fgn = WL.flag + " " + WL.name;
  const frontLang = askEn ? fgn : "🇩🇪 Deutsch", backLang = askEn ? "🇩🇪 Deutsch" : fgn;
  const again = s.missed.has(w.id);
  app.innerHTML = head + `
    <div class="stack">
      ${stack.length > 2 ? '<div class="under u2 paper" aria-hidden="true"></div>' : ""}
      ${stack.length > 1 ? '<div class="under u1 paper" aria-hidden="true"></div>' : ""}
      <div class="top-card ${entering ? "" : "enter"}" id="top">
        <div class="card ${s.flipped ? "flipped" : ""}" id="card" role="button" tabindex="0" aria-label="Karte umdrehen">
          <div class="face front paper">
            <div class="lang">${frontLang}</div>
            ${askEn ? speakBtn() : ""}
            <div class="word">${esc(front)}</div>
            <div class="hint">${again ? "Die kennst du schon von vorhin! Tippe zum Umdrehen." : "Weißt du es? Tippe auf die Karte zum Umdrehen."}</div>
          </div>
          <div class="face back paper">
            <div class="lang">${backLang}</div>
            ${askEn ? "" : speakBtn()}
            <div class="word">${esc(back)}</div>
            <div class="hint">${esc(front)}</div>
          </div>
        </div>
      </div>
    </div>
    <div id="controls"></div>
  `;
  const card = document.getElementById("card"), controls = document.getElementById("controls");
  function showControls(){
    controls.innerHTML = s.flipped
      ? `<div class="answers"><button class="btn bad" id="no">✗ Nicht gewusst</button><button class="btn good" id="yes">✓ Gewusst</button></div>`
      : "";
    if(s.flipped){
      document.getElementById("no").onclick = () => answer(false);
      document.getElementById("yes").onclick = () => answer(true);
    }
  }
  function flip(){
    if(s.flipped) return;
    s.flipped = true; card.classList.add("flipped"); showControls();
    if(!askEn) speakAnswer(w, s.dir);   // DE → EN: das englische Wort wird erst jetzt sichtbar
  }
  card.onclick = e => { if(e.target.closest(".speak")) return; flip(); };
  card.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); flip(); } };
  app.querySelectorAll(".speak").forEach(b => b.onclick = e => {
    e.stopPropagation();
    // Vorgelesen wird immer nur das Wort in der Fremdsprache
    toggleSpeak(() => speakWord(w));
  });
  showControls();
  // EN → DE: das englische Wort ist sofort sichtbar, also gleich vorlesen
  if(askEn && !s.flipped) setTimeout(() => { if(document.body.contains(card)) speakAnswer(w, s.dir); }, 250);
}

/* Gemeinsamer Rahmen für Eintippen, Auswahl, Buchstabensalat und Frosch-Sprung */
function renderChallenge(head, w){
  const s = ui.session, askEn = s.dir === "ende";
  const prompt = promptOf(w, s.dir), ans = answerOf(w, s.dir);
  const st = s.state || (s.state = makeState(s.type, w, s.dir));
  app.innerHTML = head + `
    <div class="mini-card paper ${s.type === "climb" || s.type === "pipes" ? "compact" : ""}">
      <div class="lang">${askEn ? wordLang(w).flag + " " + wordLang(w).name : "🇩🇪 Deutsch"} <span class="muted" style="font-weight:600">→ ${askEn ? "🇩🇪 Deutsch" : wordLang(w).flag + " " + wordLang(w).name}</span></div>
      ${askEn ? speakBtn("say") : ""}
      <div class="word">${esc(prompt)}</div>
    </div>
    <div id="task"></div>
    <div id="feedback" aria-live="polite"></div>
  `;
  // Lautsprecher: schaltet das automatische Vorlesen aus und ein; beim Einschalten wird sofort vorgelesen
  const say = document.getElementById("say");
  if(say) say.onclick = () => toggleSpeak(() => speakWord(w));
  if(askEn && !st.finished) setTimeout(() => { if(document.body.contains(task)) speakAnswer(w, s.dir); }, 250);
  const task = document.getElementById("task"), fb = document.getElementById("feedback");
  // Kurze Sperre nach dem Kartenwechsel, damit ein Tipp auf „Weiter“ nicht auf der nächsten Karte landet
  app.classList.add("tap-guard");
  clearTimeout(window.__tapGuard);
  window.__tapGuard = setTimeout(() => app.classList.remove("tap-guard"), 500);

  function done(right, given){
    if(st.finished) return;
    st.finished = true;
    if(!askEn) speakAnswer(w, s.dir);
    if(right){
      fb.innerHTML = `<button class="verdict good verdict-btn" id="goOn">✓ Richtig!${given && simple(given) !== simple(ans) ? ` Ganz genau: <strong>${esc(ans)}</strong>` : ""} <span class="verdict-next">Weiter ▶</span></button>`;
      let advanced = false;
      const goNext = () => { if(advanced) return; advanced = true; answer(true); };
      document.getElementById("goOn").onclick = goNext;
      setTimeout(goNext, st.delay || 1500);
    } else {
      fb.innerHTML = `<div class="verdict bad">Richtig wäre: <strong>${esc(ans)}</strong></div>
        <button class="btn" id="goOn">Weiter</button>`;
      document.getElementById("goOn").onclick = () => answer(false);
      document.getElementById("goOn").focus();
    }
  }

  if(s.type === "typing"){
    task.innerHTML = `
      <input type="text" id="typed" class="typed" placeholder="Übersetzung eintippen" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Übersetzung">
      <div class="answers" style="margin-top:10px">
        <button class="btn ghost" id="dunno">Weiß ich nicht</button>
        <button class="btn" id="check">Prüfen</button>
      </div>`;
    const inp = document.getElementById("typed");
    const check = () => { if(st.finished) return; const v = inp.value; if(!v.trim()) { inp.focus(); return; }
      const ok = isCorrect(v, ans, s.dir === "deen" && wordLang(w).key === "fr"); inp.classList.add(ok ? "ok" : "no"); inp.readOnly = true;
      task.querySelector(".answers").remove(); done(ok, v); };
    inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); check(); } });
    document.getElementById("check").onclick = check;
    document.getElementById("dunno").onclick = () => { inp.readOnly = true; task.querySelector(".answers").remove(); done(false); };
    setTimeout(() => inp.focus(), 50);
  }

  if(s.type === "choice"){
    task.innerHTML = `<div class="choices">${st.options.map((o, i) => `<button class="choice" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
    task.querySelectorAll(".choice").forEach(b => b.onclick = () => {
      if(st.finished) return;
      const pickText = st.options[+b.dataset.i], ok = pickText === ans;
      task.querySelectorAll(".choice").forEach(x => { x.disabled = true; if(st.options[+x.dataset.i] === ans) x.classList.add("right"); });
      if(!ok) b.classList.add("wrong");
      done(ok);
    });
  }

  if(s.type === "letters"){
    // Nur die Buchstaben der Lösung; in der richtigen Reihenfolge antippen, benutzte werden grau
    const draw = () => {
      let k = 0;
      const slots = st.target.map(ch => {
        if(ch === " ") return '<span class="gap"></span>';
        const i = k++, filled = i < st.pos;
        return `<span class="slot ${filled ? "filled" : ""}">${filled ? esc(st.letters[i]) : ""}</span>`;
      }).join("");
      task.innerHTML = `
        <div class="slots" id="slots">${slots}</div>
        <div class="tiles">${st.tiles.map((t, i) => `<button class="tile" data-i="${i}" ${st.used.includes(i) ? "disabled" : ""}>${esc(t)}</button>`).join("")}</div>
        ${st.finished ? "" : `<div style="margin-top:12px"><button class="btn ghost" id="dunno">Weiß ich nicht</button></div>`}`;
      task.querySelectorAll(".tile").forEach(b => b.onclick = () => {

        ${st.finished ? "" : `<div class="answers" style="margin-top:12px"><button class="btn ghost" id="undo" ${st.picked.length ? "" : "disabled"}>⌫ Zurück</button><button class="btn ghost" id="dunno">Weiß ich nicht</button></div>`}`;
      task.querySelectorAll(".tile").forEach(b => b.onclick = () => {

      const undo = document.getElementById("undo"); if(undo) undo.onclick = () => { st.picked.pop(); drawScramble(); };
      const dn = document.getElementById("dunno"); if(dn) dn.onclick = () => { { const a = task.querySelector(".answers"); if(a) a.remove(); } done(false); };

  }

  if(s.type === "pipes"){

    task.innerHTML = `<div class="pipes-wrap">${pipesSVG(st)}</div>
      <p class="muted" style="text-align:center;margin:8px 0 0">Welcher Wasserhahn führt zum richtigen Wort? Tippe ihn an!</p>`;
    runPipes(st, ans, ok => done(ok));
  }
  if(s.type === "climb"){

        <div class="start-pad"></div>

function makeState(type, w, dir){
  const ans = answerOf(w, dir);
  if(type === "choice") return { options: shuffle([ans, ...distractors(w, dir, 3)]) };
  if(type === "pipes") return Object.assign({ options: shuffle([ans, ...distractors(w, dir, 2)]) }, makePipes());
  if(type === "climb") return { options: shuffle([ans, ...distractors(w, dir, 2)]) };
  if(type === "frog") return { options: shuffle([ans, ...distractors(w, dir, 2)]) };
  if(type === "letters"){
    const target = [...(stripParens(ans) || ans)];   // Klammer-Teil wird nicht gelegt
    const letters = target.filter(c => c !== " ").map(c => c.toLowerCase());
    let tiles = shuffle(letters), n = 0;
    while(letters.length > 1 && tiles.join("") === letters.join("") && n++ < 10) tiles = shuffle(letters);
    return { target, letters, tiles, used: [], pos: 0, errors: 0 };
  }
  if(type === "scramble"){
    const target = [...ans];
    const letters = target.filter(c => c !== " ").map(c => c.toLowerCase()); // Kleinbuchstaben, damit der erste Buchstabe nichts verrät
    let tiles = shuffle(letters), n = 0;
    while(tiles.join("") === letters.join("") && n++ < 10) tiles = shuffle(letters);
    return { target, letters, tiles, picked: [] };
  }
  return {};
}

function answer(knew){
  if(ui.busy) return;
  const s = ui.session, stack = sessionStack();
  const id = stack.shift(), w = wordById(id);
  {
    if(!w.ml) w.ml = {};
    w.ml[s.mode] = knew ? Math.min(5, (w.ml[s.mode] || 0) + 1) : 0;
  }
  let label;
  if(knew){
    w.level[s.dir] = Math.min(5, w.level[s.dir] + 1);
    if(!s.missed.has(id)) s.firstTry++;
    s.done++;
    s.perGroup[w.groupId] = (s.perGroup[w.groupId] || 0) + 1;
    label = "✓ Weit nach hinten gelegt";
  } else {
    w.level[s.dir] = 0;
    s.missed.add(id);
    label = "🔁 Kommt gleich wieder";
  }
  // In einer Runde kommen alle Karten dran: gewusste Karten wandern hinter alle, die in dieser Runde noch fehlen
  if(knew) s.doneSet.add(id);
  let pos = sortBackPosition(w.level[s.dir], stack.length);
  if(knew){
    const open = stack.filter(x => !s.doneSet.has(x)).length;
    let k = 0, after = 0;
    for(; after < stack.length && k < open; after++) if(!s.doneSet.has(stack[after])) k++;
    pos = Math.max(pos, after);
  }
  stack.splice(pos, 0, id);
  save();

  const top = document.getElementById("top");
  const next = () => {
    ui.busy = false;
    if(s.done >= s.target) return finish();
    pickDir();
    renderLearn(false);
    window.scrollTo(0,0);
  };
  if(!top){ next(); return; }
  ui.busy = true;
  document.getElementById("controls").innerHTML = `<div class="sorted" aria-live="polite">${label}</div>`;
  top.classList.remove("enter");
  top.classList.add(knew ? "away-far" : "away-near");
  setTimeout(next, 420);
}

function finish(){
  const s = ui.session;
  const ratio = s.target ? s.firstTry / s.target : 0;
  const base = starsForRound(ratio);
  const bonus = ratio >= .6 ? modeOf(s.mode).bonus : 0;
  const coinBonus = Math.min(2, Math.floor((s.coins || 0) / 10));
  const stars = base + bonus + coinBonus;
  const groupsIn = (s.mix || [ui.groupId]).map(group).filter(Boolean);
  let shares = [stars];
  if(groupsIn.length > 1){
    const counts = groupsIn.map(g => s.perGroup[g.id] || 0), total = counts.reduce((a, b) => a + b, 0) || 1;
    const raw = counts.map(c => stars * c / total);
    shares = raw.map(Math.floor);
    let rest = stars - shares.reduce((a, b) => a + b, 0);
    raw.map((v, i) => [v - Math.floor(v), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if(rest > 0){ shares[i]++; rest--; } });
  }
  const medals = []; let newTrophy = null;
  groupsIn.forEach((g, i) => {
    const before = trophies(g);
    g.stars = (g.stars || 0) + shares[i];
    checkMedals(g).forEach(m => medals.push(Object.assign({ group: g.name }, m)));
    if(trophies(g) > before) newTrophy = { name: g.name, stars: g.stars };
  });
  save();
  ui.result = { total: s.target, firstTry: s.firstTry, missed: [...s.missed], stars: base, bonus, coins: s.coins || 0, coinBonus, medals, newTrophy, mode: s.mode,
    mix: s.mix, shares: groupsIn.map((g, i) => ({ name: g.name, n: shares[i] })) };
  ui.session = null;
  go("#ergebnis", true);
}

/* ---------- Konfetti, wenn eine Runde komplett richtig war ---------- */
function launchConfetti(){
  try{
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    document.querySelectorAll("canvas.confetti").forEach(c => c.remove());
    const c = document.createElement("canvas");
    c.className = "confetti"; c.setAttribute("aria-hidden", "true");
    document.body.appendChild(c);
    const dpr = window.devicePixelRatio || 1, W = window.innerWidth, H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    const x = c.getContext("2d"); x.scale(dpr, dpr);
    const colors = ["#FFC83D", "#1F8F5C", "#E5484D", "#4FC3F7", "#F08C2E", "#B57EDC"];
    const parts = [];
    for(let i = 0; i < 160; i++){
      const left = i % 2 === 0, delay = i < 80 ? 0 : 0.35;
      parts.push({ x: left ? -10 : W + 10, y: H * .75, vx: (left ? 1 : -1) * (5 + Math.random() * 9), vy: -(12 + Math.random() * 10),
        w: 7 + Math.random() * 6, h: 11 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
        c: colors[i % colors.length], delay, flip: Math.random() * 6 });
    }
    const start = performance.now();
    let last = start;
    const frame = now => {
      const t = (now - start) / 1000, dt = Math.min(.033, (now - last) / 1000) * 60; last = now;
      x.clearRect(0, 0, W, H);
      parts.forEach(p => {
        if(t < p.delay) return;
        p.vy += .32 * dt; p.vx *= Math.pow(.985, dt); p.vy *= Math.pow(.99, dt);
        p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.flip += .15 * dt;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.scale(1, Math.cos(p.flip));
        x.globalAlpha = Math.max(0, Math.min(1, (4.2 - t) / .8));
        x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        x.restore();
      });
      if(t < 4.2 && document.body.contains(c)) requestAnimationFrame(frame); else c.remove();
    };
    requestAnimationFrame(frame);
  }catch(e){}
}

/* ---------- Liste einfügen ---------- */
const DE_WORDS = new Set("der die das den dem des ein eine einen einem einer und oder nicht mit auf für von zu ist sind sein haben werden etwas jemand jdn jdm jds etw sich man auch sehr kein keine".split(" "));
const EN_WORDS = new Set("the a an to of and or not with on for from is are be have get something somebody someone sb sth very no".split(" "));
const IPA = /[ˈˌəɪʊæɒʌɔːθðŋʃʒɜɑ]/;

function cleanLines(text){
  return String(text || "").split(/\r?\n/).map(l => {
    l = l.replace(/\[[^\]]*\]/g, m => IPA.test(m) ? " " : m)
         .replace(/\/[^\/\n]{1,40}\//g, m => IPA.test(m) ? " " : m)
         .replace(/^\s*[•·▪*]\s*/, "")
         .replace(/\s+([–—=→|-])\s+/g, " $1 ")
         .replace(/\s+$/,"").replace(/^\s+/,"");
    return l;
  }).filter(l => l && !/^[\d\s.,;:!?()\-–—]*$/.test(l));
}
let PARSE_LANG = "en";
const FR_WORDS = new Set("le la les un une des de du et est à au aux en pour avec dans sur pas ne je tu il elle nous vous ils elles mon ma mes ton ta tes son sa ses ce cette qui que".split(" "));
function langScore(t){ // > 0 eher Fremdsprache (Englisch oder Französisch), < 0 eher Deutsch
  if(PARSE_LANG === "fr") return frScore(t);
  let s = 0;
  if(/[äöüß]/i.test(t)) s -= 4;
  t.split(/[\s,()]+/).filter(Boolean).forEach(w => {
    const lw = w.toLowerCase().replace(/[.!?;:]/g, "");
    if(DE_WORDS.has(lw)) s -= 2;
    if(EN_WORDS.has(lw)) s += 2;
    if(/^[A-ZÄÖÜ][a-zäöüß]/.test(w) && w !== "I") s -= 1;
    if(/th|wh|ing$|ight|ea|oo|y$|ou/.test(lw)) s += .7;
    if(/sch|tz|ung$|keit$|heit$|chen$|lich$|ei/.test(lw)) s -= .7;
    if(/c(?![hk])/.test(lw)) s += .5;
  });
  return s;
}
const sum = a => a.reduce((x,y) => x + y, 0);
const SEP = /\t|\s[–—-]\s|\s*=\s*|\s*;\s*|\s*\|\s*|\s*→\s*|\s*:\s+|\s{2,}/;

function frScore(t){
  let s = 0;
  if(/[äöüß]/i.test(t)) s -= 4;
  if(/[éèêëàâîïôûùçœ]/i.test(t)) s += 3;
  if(/\b[ldjmnst]['’]/i.test(t)) s += 2;
  t.split(/[\s,()]+/).filter(Boolean).forEach(w => {
    const lw = w.toLowerCase().replace(/[.!?;:]/g, "");
    if(DE_WORDS.has(lw)) s -= 2;
    if(FR_WORDS.has(lw)) s += 2;
    if(/^[A-ZÄÖÜ][a-zäöüß]/.test(w)) s -= 1;
    if(/tion$|eux$|eau$|oir$|ais$|ait$|ette$|ou$|oi|qu/.test(lw)) s += .7;
    if(/sch|tz|ung$|keit$|heit$|chen$|lich$|ei/.test(lw)) s -= .7;
  });
  return s;
}
function bestRowSplit(line, orient){
  const w = line.split(/\s+/);
  if(w.length < 2) return [line, ""];
  let best = null, bestV = -Infinity;
  for(let i = 1; i < w.length; i++){
    const a = w.slice(0, i).join(" "), b = w.slice(i).join(" ");
    let v = orient * (langScore(a) - langScore(b));
    const lastLeft = w[i-1].toLowerCase();
    if(EN_WORDS.has(lastLeft) || DE_WORDS.has(lastLeft)) v -= 3; // „to | go“ oder „das | Wetter“ nicht trennen
    if(v > bestV){ bestV = v; best = [a, b]; }
  }
  return best;
}
function orientPairs(left, right){
  const d = sum(left.map(langScore)) - sum(right.map(langScore));
  return d >= 0 ? { en:left, de:right, swapped:false } : { en:right, de:left, swapped:true };
}
function parseOne(text){
  const lines = cleanLines(text);
  if(!lines.length) return null;
  const withSep = lines.filter(l => SEP.test(l)).length;
  if(withSep >= lines.length * .6){
    const L = [], R = [];
    lines.forEach(l => {
      const m = l.match(SEP);
      if(m){ L.push(l.slice(0, m.index).trim()); R.push(l.slice(m.index + m[0].length).replace(/^[–—=:;|→\s-]+/, "").trim()); }
      else { const p = bestRowSplit(l, 1); L.push(p[0]); R.push(p[1]); }
    });
    return Object.assign(orientPairs(L, R), { how:"sep" });
  }
  const multi = lines.filter(l => /\s/.test(l)).length;
  // Variante A: Spalten wurden nacheinander kopiert (erst alle Wörter der einen, dann der anderen Sprache)
  const n = lines.length, sc = lines.map(langScore);
  let bestK = Math.ceil(n / 2), bestV = -Infinity;
  for(let k = 1; k < n; k++){
    const v = Math.abs(sum(sc.slice(0, k)) - sum(sc.slice(k))) - Math.abs(k - n / 2) * .3;
    if(v > bestV){ bestV = v; bestK = k; }
  }
  // Variante B: jede Zeile enthält ein Paar ohne Trennzeichen
  const tries = [1, -1].map(o => {
    const p = lines.map(l => bestRowSplit(l, o));
    return { o, p, v: sum(p.map(([a,b]) => o * (langScore(a) - langScore(b)))) };
  });
  const t = tries[0].v >= tries[1].v ? tries[0] : tries[1];
  const colWins = n >= 2 && (multi < n * .5 || (bestV > t.v && bestV >= 2));
  if(colWins){
    if(bestV < 2) bestK = Math.ceil(n / 2);
    return Object.assign(orientPairs(lines.slice(0, bestK), lines.slice(bestK)), { how:"col" });
  }
  const L = t.p.map(x => x[0]), R = t.p.map(x => x[1]);
  return t.o === 1 ? { en:L, de:R, swapped:false, how:"row" } : { en:R, de:L, swapped:true, how:"row" };
}
function parseTwo(enText, deText){
  const a = cleanLines(enText), b = cleanLines(deText);
  if(!a.length && !b.length) return null;
  return Object.assign(orientPairs(a, b), { how:"two" });
}

function renderImport(){

  PARSE_LANG = L.key;
  if(imp.preview) return renderPreview();
  app.innerHTML = `
    <div class="topbar"><button class="back" id="back">‹ ${esc(g.name)}</button></div>
    <h1>Liste einfügen</h1>
    <ol class="steps">
      <li>Öffne Google Lens oder die Kamera und fotografiere die Vokabelseite.</li>
      <li>Markiere die Wörter und tippe auf „Kopieren“.</li>
      <li>Füge den Text hier ein. Die App ordnet die Paare selbst zu.</li>
    </ol>
    <section class="panel">
      <div class="seg" role="group" aria-label="Art der Liste" style="grid-template-columns:1fr 1fr">

      ${imp.mode === "one" ? `

  `;
  const keep = () => {

function renderPreview(){
  const imp = ui.imp, p = imp.preview, g = group(ui.groupId), L = groupLang(g);
  const existing = new Set(wordsOf(g.id).map(w => w.en.toLowerCase()));
  const rows = Math.max(p.en.length, p.de.length);
  const mismatch = p.en.length !== p.de.length;
  app.innerHTML = `
    <div class="topbar"><button class="back" id="back">‹ Liste ändern</button></div>
    <h1>Vorschau</h1>
    <p class="muted">Prüfe die Paare. Tippe in ein Feld, um es zu korrigieren.</p>
    ${p.how === "photo" ? `<div class="note info">📷 Vom Foto gelesen. Bitte kurz prüfen, ob alles stimmt.</div>` : ""}
    ${p.swapped ? `<div class="note info">Links stand Deutsch. Die App hat die Spalten getauscht.</div>` : ""}
    ${mismatch ? `<div class="note warn">${plural(p.en.length, L.adj, L.adj)}, aber ${plural(p.de.length, "deutsche", "deutsche")} Zeilen. Bitte prüfen, ab wo die Paare verrutscht sind. Mit ⋯ kannst du Zeilen verbinden oder löschen.</div>` : ""}
    <div class="pbar"><button class="btn ghost small" id="swap">⇄ Spalten tauschen</button></div>
    <section class="panel" style="padding:12px">
      <div class="phead"><span></span><span>${L.flag} ${L.name}</span><span>🇩🇪 Deutsch</span><span></span></div>
      ${Array.from({ length: rows }, (_, i) => {
        const en = p.en[i] != null ? p.en[i] : "", de = p.de[i] != null ? p.de[i] : "";
        const dupe = en && existing.has(en.trim().toLowerCase());
        return `<div class="prow ${dupe ? "dupe" : ""}">
          <span class="pn">${i + 1}</span>
          <input type="text" data-c="en" data-i="${i}" value="${esc(en)}" class="${en.trim() ? "" : "missing"}" autocapitalize="none" spellcheck="false" aria-label="${L.name} Zeile ${i+1}">
          <input type="text" data-c="de" data-i="${i}" value="${esc(de)}" class="${de.trim() ? "" : "missing"}" aria-label="Deutsch Zeile ${i+1}">
          <button class="pmore" data-i="${i}" aria-label="Zeile ${i+1} bearbeiten">⋯</button>
        </div>${dupe ? `<p class="goal" style="margin:-4px 0 8px 2.2em">„${esc(en)}“ ist schon in der Gruppe und wird übersprungen.</p>` : ""}`;
      }).join("")}
    </section>
    <button class="btn" id="saveAll"></button>
  `;
  const saveBtn = document.getElementById("saveAll");
  const valid = () => {
    const seen = new Set(existing), out = [];
    const rows = Math.max(p.en.length, p.de.length);
    for(let i = 0; i < rows; i++){
      const en = norm(p.en[i] || ""), de = norm(p.de[i] || "");
      if(!en || !de || seen.has(en.toLowerCase())) continue;
      seen.add(en.toLowerCase()); out.push({ en, de });
    }
    return out;
  };
  const updateBtn = () => {
    const n = valid().length;
    saveBtn.textContent = n ? `✓ ${plural(n, "Karte", "Karten")} speichern` : "Keine vollständigen Paare";
    saveBtn.disabled = !n;
  };
  updateBtn();
  app.querySelectorAll(".prow input").forEach(inp => inp.addEventListener("input", () => {
    const arr = p[inp.dataset.c], i = +inp.dataset.i;
    while(arr.length <= i) arr.push("");
    arr[i] = inp.value;
    inp.classList.toggle("missing", !inp.value.trim());
    updateBtn();
  }));
  document.getElementById("back").onclick = () => { imp.preview = null; renderImport(); };
  document.getElementById("swap").onclick = () => { [p.en, p.de] = [p.de, p.en]; p.swapped = false; renderPreview(); };
  app.querySelectorAll(".pmore").forEach(b => b.onclick = async () => {
    const i = +b.dataset.i, last = i >= rows - 1;
    const label = `Zeile ${i + 1}: ${(p.en[i] || "…")} – ${(p.de[i] || "…")}`;
    const opts = [
      { value:"row", label:"Ganze Zeile löschen" },
      { value:"en", label:`Nur ${L.name} löschen, Rest rutscht hoch` },
      { value:"de", label:"Nur Deutsch löschen, Rest rutscht hoch" }
    ];
    if(!last){
      opts.push({ value:"joinEn", label:`${L.name} mit nächster Zeile verbinden` });
      opts.push({ value:"joinDe", label:"Deutsch mit nächster Zeile verbinden" });
    }
    const c = await choose("Zeile bearbeiten", label, opts);
    if(!c) return;
    const sY = window.scrollY;
    if(c === "row"){ p.en.splice(i, 1); p.de.splice(i, 1); }
    if(c === "en") p.en.splice(i, 1);
    if(c === "de") p.de.splice(i, 1);
    if(c === "joinEn" && i + 1 < p.en.length){ p.en[i] = norm((p.en[i] || "") + " " + p.en[i+1]); p.en.splice(i + 1, 1); }
    if(c === "joinDe" && i + 1 < p.de.length){ p.de[i] = norm((p.de[i] || "") + " " + p.de[i+1]); p.de.splice(i + 1, 1); }
    while(p.en.length && !norm(p.en[p.en.length-1] || "") && !norm(p.de[p.en.length-1] || "") && p.en.length >= p.de.length){ p.en.pop(); if(p.de.length > p.en.length) p.de.pop(); }
    renderPreview();
    window.scrollTo(0, sY);
  });
  saveBtn.onclick = () => {
    const list = valid();
    if(!list.length) return;
    const stack = stackOf(g), now = Date.now();
    const newIds = list.map((x, k) => {
      const w = { id: uid(), groupId: g.id, en: x.en, de: x.de, level: { ende:0, deen:0 }, created: now + k };
      S.words.push(w); return w.id;
    });
    g.order = newIds.concat(stack.filter(id => !newIds.includes(id)));
    save();
    ui.imp = null;
    ui.flash = `${plural(list.length, "Karte", "Karten")} gespeichert.`;
    ui.editMode = true;
    go("#gruppe", true);
  };
  window.scrollTo(0,0);
}

/* ---------- Sicherung ---------- */
function renderBackup(){
  app.innerHTML = banner() + `
    <div class="topbar"><button class="back" id="back">‹ Gruppen</button></div>
    <h1>💾 Sicherung</h1>
    <p class="muted">Speichert alle Gruppen, Karten, Sterne und Pokale in einer Datei. So geht nichts verloren, auch nicht bei einem neuen Handy.</p>
    <section class="panel">
      <p class="goal" style="margin-top:0">${S.lastBackup ? "Letzte Sicherung: " + new Date(S.lastBackup).toLocaleDateString("de-DE", {day:"numeric", month:"long", year:"numeric"}) : "Noch keine Sicherung gespeichert."}</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
        <button class="btn" id="exp">💾 Sicherung speichern</button>
        <button class="btn ghost" id="imp">📂 Sicherung laden</button>
        ${defaultsAvailable() ? '<button class="btn ghost" id="loadDefaults">📚 Standard-Gruppen laden</button>' : ""}
      </div>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
      <div class="msg" id="bmsg" aria-live="polite"></div>
    </section>
  `;
  const bmsg = document.getElementById("bmsg");
  if(ui.backupMsg){ bmsg.textContent = ui.backupMsg.text; bmsg.className = "msg " + ui.backupMsg.kind; ui.backupMsg = null; }
  document.getElementById("back").onclick = () => go("#start");
  document.getElementById("exp").onclick = e => exportBackup(e.currentTarget, bmsg);
  const file = document.getElementById("impFile");
  document.getElementById("imp").onclick = () => file.click();
  const ld = document.getElementById("loadDefaults");
  if(ld) ld.onclick = async () => {
    ld.disabled = true;
    try{
      const d = await fetchDefaults();
      if(!d){ bmsg.textContent = "Es wurden keine Standard-Gruppen gefunden."; bmsg.className = "msg err"; ld.disabled = false; return; }
      const added = addDefaults(d, true);
      ui.backupMsg = added.length
        ? { kind:"ok", text:`${plural(added.length, "Standard-Gruppe", "Standard-Gruppen")} geladen.` }
        : { kind:"ok", text:"Alle Standard-Gruppen sind schon da." };
      renderBackup();
    }catch(e){
      bmsg.textContent = "Die Standard-Gruppen konnten nicht geladen werden. Bitte mit Internet versuchen."; bmsg.className = "msg err"; ld.disabled = false;
    }
  };
  file.onchange = () => { if(file.files[0]) importBackup(file.files[0], bmsg); file.value = ""; };
  window.scrollTo(0,0);
}
async function exportBackup(btn, msg){
  const data = JSON.stringify({ app:"wortschatzkiste", version:2, exported:new Date().toISOString(), data:S });
  const filename = "wortschatzkiste-sicherung-" + new Date().toISOString().slice(0,10) + ".json";
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Wird vorbereitet …";
  let dl = null;
  try{ if(window.claude && typeof window.claude.use === "function") dl = await window.claude.use("downloads"); }catch(e){ dl = null; }
  try{
    if(dl){
      await dl.save({ filename, data });
    } else {
      const url = URL.createObjectURL(new Blob([data], { type:"application/json" }));
      const a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    }
    S.lastBackup = Date.now(); save();
    ui.backupMsg = { kind:"ok", text:`Sicherung „${filename}“ gespeichert. Du findest sie im Ordner „Downloads“.` };
    renderBackup();
  }catch(e){
    btn.disabled = false; btn.textContent = label;
    const code = e && e.code;
    msg.textContent = code === "declined" ? "Sicherung abgebrochen." : code === "rate_limited" ? "Bitte kurz warten und noch einmal tippen." : "Die Sicherung konnte hier nicht gespeichert werden.";
    msg.className = "msg err";
  }
}

function importBackup(file, msg){
  const r = new FileReader();
  r.onerror = () => { msg.textContent = "Die Datei konnte nicht gelesen werden."; msg.className = "msg err"; };
  r.onload = async () => {
    let d;
    try{
      const o = JSON.parse(r.result);
      d = o && o.app === "wortschatzkiste" && o.data ? o.data : null;
      if(!d || !Array.isArray(d.groups) || !Array.isArray(d.words)) throw 0;
      d = migrate(d);
    }catch(e){
      msg.textContent = "Das ist keine Sicherung der Wortschatzkiste."; msg.className = "msg err"; return;
    }
    const known = new Set(S.groups.map(g => g.id));
    const fresh = d.groups.filter(g => !known.has(g.id));
    const c = await choose("Sicherung laden",
      `In der Datei: ${plural(d.groups.length, "Gruppe", "Gruppen")} mit ${plural(d.words.length, "Karte", "Karten")}.`,
      [
        { value:"merge", label: fresh.length ? `${plural(fresh.length, "neue Gruppe", "neue Gruppen")} dazunehmen` : "Nichts Neues zum Dazunehmen", primary:true },
        { value:"replace", label:"Alles hier ersetzen", danger:true }
      ]);
    if(!c) return;
    if(c === "replace"){
      if(S.groups.length){
        const ok = await choose("Wirklich ersetzen?", "Alle Gruppen und Karten auf diesem Handy werden durch die Sicherung ersetzt.", [{ value:"yes", label:"Ja, ersetzen", danger:true }]);
        if(!ok) return;
      }
      const last = S.lastBackup;
      S = d; if(last && !S.lastBackup) S.lastBackup = last;
      save();
      ui.backupMsg = { kind:"ok", text:`${plural(S.groups.length, "Gruppe", "Gruppen")} geladen.` };
    } else {
      const ids = new Set(fresh.map(g => g.id));
      S.groups.push(...fresh);
      S.words.push(...d.words.filter(w => ids.has(w.groupId)));
      save();
      ui.backupMsg = fresh.length
        ? { kind:"ok", text:`${plural(fresh.length, "Gruppe", "Gruppen")} dazugenommen.` }
        : { kind:"ok", text:"Alle Gruppen aus der Sicherung sind schon da." };
    }
    renderBackup();
  };
  r.readAsText(file);
}

/* ---------- Dialog ---------- */
function ask(opt){
  return new Promise(resolve => {
    dlg.innerHTML = `<form method="dialog">
      <h3>${esc(opt.title)}</h3>
      ${opt.text ? `<p class="muted">${esc(opt.text)}</p>` : ""}
      ${(opt.fields||[]).map(f => `<label class="field"><span>${esc(f.label)}</span>
        <input type="text" name="${f.name}" value="${esc(f.value||"")}" placeholder="${esc(f.placeholder||"")}" autocomplete="off"></label>`).join("")}
      <div class="dlg-actions">
        <button class="btn ${opt.danger ? "bad" : ""}" value="ok">${esc(opt.ok)}</button>
        ${opt.extra ? `<button class="btn ghost" value="extra" style="color:var(--bad)">${esc(opt.extra)}</button>` : ""}
        <button class="btn ghost" value="cancel" formnovalidate>Abbrechen</button>
      </div></form>`;
    const form = dlg.querySelector("form");
    let choice = "cancel";
    form.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { choice = b.value; }));
    form.addEventListener("submit", e => { if(e.submitter && e.submitter.value) choice = e.submitter.value; });
    dlg.onclose = () => {
      if(choice === "extra") return resolve("extra");
      if(choice !== "ok") return resolve(null);
      const out = {};
      form.querySelectorAll("input").forEach(i => out[i.name] = i.value);
      resolve(out);
    };
    dlg.showModal();
    const first = form.querySelector("input");
    if(first){ first.focus(); first.select(); }
  });
}

function choose(title, text, options){
  return new Promise(resolve => {
    dlg.innerHTML = `<form method="dialog">
      <h3>${esc(title)}</h3>
      ${text ? `<p class="muted">${esc(text)}</p>` : ""}
      <div class="dlg-actions">
        ${options.map(o => `<button class="btn ${o.primary ? "" : "ghost"}" value="${o.value}" ${o.danger ? 'style="color:var(--bad)"' : ""}>${esc(o.label)}</button>`).join("")}
        <button class="btn ghost" value="cancel">Abbrechen</button>
      </div></form>`;
    let choice = "cancel";
    dlg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { choice = b.value; }));
    dlg.onclose = () => resolve(choice === "cancel" ? null : choice);
    dlg.showModal();
  });
}

/* ---------- Standard-Gruppen aus standard-gruppen.json (neben der App, z. B. auf GitHub Pages) ---------- */
const DEFAULTS_FILE = "standard-gruppen.json";
function defaultsAvailable(){ return !window.claude && location.protocol.startsWith("http"); }
async function fetchDefaults(){
  const r = await fetch(DEFAULTS_FILE + "?t=" + Date.now(), { cache: "no-store" });
  if(!r.ok) return null;
  const o = await r.json();
  const d = o && o.data ? o.data : o;   // eine normale Sicherung oder nur {groups, words}
  if(!d || !Array.isArray(d.groups) || !Array.isArray(d.words)) return null;
  return d;
}
// Fügt Standard-Gruppen hinzu: Namen und Karten, ohne Fortschritt. force: auch früher gelöschte wieder holen
function addDefaults(d, force){
  if(!S.settings.defaultsSeen) S.settings.defaultsSeen = [];
  const seen = new Set(S.settings.defaultsSeen), have = new Set(S.groups.map(g => g.id));
  const added = [];
  d.groups.forEach(src => {
    if(!src || !src.id || !src.name) return;
    if(have.has(src.id)){ seen.add(src.id); return; }
    if(seen.has(src.id) && !force) return;
    const g = { id: src.id, name: String(src.name), grade: +src.grade || S.settings.grade || null, lang: LANGS[src.lang] ? src.lang : "en", created: Date.now(), order: [], stars: 0, medals: {}, fromDefault: true };
    S.groups.push(g);
    d.words.filter(w => w && w.groupId === src.id && w.en && w.de).forEach(w => {
      S.words.push({ id: uid(), groupId: g.id, en: String(w.en), de: String(w.de), level: { ende: 0, deen: 0 }, ml: {}, created: Date.now() });
    });
    seen.add(src.id); added.push(g);
  });
  S.settings.defaultsSeen = [...seen];
  if(added.length) save();
  return added;
}
async function loadDefaultsOnStart(){
  if(!defaultsAvailable()) return;
  try{
    const d = await fetchDefaults();
    if(!d) return;
    const added = addDefaults(d, false);
    if(added.length && !ui.session && (location.hash === "" || location.hash === "#start")){
      const mine = added.filter(g => g.grade === S.settings.grade && g.lang === (S.settings.lang || "en")).length;
      if(mine) ui.homeNote = `📚 ${plural(mine, "neue Gruppe", "neue Gruppen")} hinzugefügt.`;
      render();
    }
  }catch(e){}
}

render();
loadDefaultsOnStart();
})();
